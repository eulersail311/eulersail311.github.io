<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title-52716 desc-52716"><title id="title-52716">测试过工作区，不等于测试过提交快照</title><desc id="desc-52716">运行通过只能为实际执行的内容提供证据；提交前还须分别核对两层差异及准备保存的路径。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#47652c"/></marker></defs><rect width="900" height="360" fill="#f8fafc"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#172b45"><text x="36" y="38" font-size="24" font-weight="700">测试过工作区，不等于测试过提交快照</text><text x="36" y="69" font-size="17" fill="#47652c">并列对照：卡片宽度不表示数量、时长或比例</text><rect x="36" y="99" width="240" height="175" rx="12" fill="white" stroke="#47652c" stroke-width="1.5"/><path d="M48 99 H264" stroke="#47652c" stroke-width="4"/><text x="52" y="133" font-size="20" font-weight="700" fill="#47652c">HEAD</text><text x="52" y="198" font-size="18">保存的值为1</text><rect x="330" y="99" width="240" height="175" rx="12" fill="white" stroke="#47652c" stroke-width="1.5"/><path d="M342 99 H558" stroke="#47652c" stroke-width="4"/><text x="346" y="133" font-size="20" font-weight="700" fill="#47652c">暂存区</text><text x="346" y="198" font-size="18">已改为2，准备提交这一份</text><rect x="624" y="99" width="240" height="175" rx="12" fill="white" stroke="#47652c" stroke-width="1.5"/><path d="M636 99 H852" stroke="#47652c" stroke-width="4"/><text x="640" y="133" font-size="20" font-weight="700" fill="#47652c">工作区</text><text x="640" y="198" font-size="18">后来改为3，直接测试看到</text><text x="640" y="228" font-size="18">的是3</text><text x="36" y="319" font-size="17">依据本文已有情境绘制 · 不表示生产测量或通用性能保证</text></g></svg>
