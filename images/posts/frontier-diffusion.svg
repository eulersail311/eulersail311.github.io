<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">掩码训练与多轮生成</title><desc id="desc">训练随机掩码，生成多轮预测与选定，预算计算全部轮次。</desc><rect width="900" height="360" rx="16" fill="#f5f3fb"/><g font-family="Microsoft YaHei, sans-serif" fill="#362d61"><text x="28" y="42" font-size="24" font-weight="bold">位置可以并行预测，完整路径仍需记账</text><g fill="#e9e3f8" stroke="#8273b1"><rect x="28" y="70" width="258" height="180" rx="12"/><rect x="320" y="70" width="258" height="180" rx="12"/><rect x="612" y="70" width="260" height="180" rx="12"/></g><g font-size="20"><text x="46" y="106" font-weight="bold">训练：随机掩码</text><text x="46" y="148">每位置以概率 t 遮罩</text><text x="46" y="184">只计未知位置的损失</text><text x="46" y="222">目标包含 1/t 权重</text><text x="338" y="106" font-weight="bold">生成：逐轮减少未知</text><text x="338" y="148">预测 → 选择 → 下一轮</text><text x="338" y="184">未知数：4 → 3 → 1 → 0</text><text x="338" y="222">轨迹为人工数量案例</text><text x="630" y="106" font-weight="bold">评价：完整生成预算</text><text x="630" y="148">各轮成本累加</text><text x="630" y="184">固定长度和质量比较</text><text x="630" y="222">缓存有效性另行核对</text></g><text x="28" y="292" font-size="20">一轮产生多个候选，并不证明一次调用就能完成整个生成过程。</text><text x="28" y="330" font-size="18">原创过程示意；不是模型输出、实验时长或精确概率采样轨迹。</text></g></svg>
