<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title-90863 desc-90863"><title id="title-90863">PPO的平台位于优势对应的一侧</title><desc id="desc-90863">用正负两种优势一起检查，才能看清min选择与裁剪方向，不能照搬正优势图形。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#5a4087"/></marker></defs><rect width="900" height="360" fill="#f8fafc"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#172b45"><text x="36" y="38" font-size="24" font-weight="700">PPO的平台位于优势对应的一侧</text><text x="36" y="69" font-size="17" fill="#5a4087">并列对照：卡片宽度不表示数量、时长或比例</text><rect x="36" y="99" width="240" height="175" rx="12" fill="white" stroke="#5a4087" stroke-width="1.5"/><path d="M48 99 H264" stroke="#5a4087" stroke-width="4"/><text x="52" y="133" font-size="20" font-weight="700" fill="#5a4087">宽度0.2、优势正1</text><text x="52" y="198" font-size="18">比值超过1.2后目标变平</text><rect x="330" y="99" width="240" height="175" rx="12" fill="white" stroke="#5a4087" stroke-width="1.5"/><path d="M342 99 H558" stroke="#5a4087" stroke-width="4"/><text x="346" y="133" font-size="20" font-weight="700" fill="#5a4087">同宽度、优势负1</text><text x="346" y="198" font-size="18">比值1.3的未裁剪项为负</text><text x="346" y="228" font-size="18">1.3</text><rect x="624" y="99" width="240" height="175" rx="12" fill="white" stroke="#5a4087" stroke-width="1.5"/><path d="M636 99 H852" stroke="#5a4087" stroke-width="4"/><text x="640" y="133" font-size="20" font-weight="700" fill="#5a4087">取较小项</text><text x="640" y="198" font-size="18">负1.3低于负1.2，这侧没</text><text x="640" y="228" font-size="18">有平台</text><text x="36" y="319" font-size="17">依据本文已有情境绘制 · 不表示生产测量或通用性能保证</text></g></svg>
