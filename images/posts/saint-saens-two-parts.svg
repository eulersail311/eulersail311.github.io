<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="title desc">
<title id="title">两个大部分，四种传统功能</title><desc id="desc">第一部分从引子快板到慢段，第二部分从快速运动到庄严终曲。非等时比例图。</desc><rect width="900" height="460" rx="20" fill="#faf5ee"/>
<g font-family="Microsoft YaHei, sans-serif" fill="#49344b"><text x="40" y="50" font-size="27" font-weight="bold">圣桑第三：先找结构，再等巨响</text><text x="40" y="86" font-size="19">原创听觉导航 · 等宽方框不表示实际时长</text>
<rect x="40" y="113" width="820" height="52" rx="10" fill="#e0d7ec"/><text x="60" y="147" font-size="23">I · 第一大部分</text>
<rect x="40" y="177" width="397" height="88" rx="10" fill="#eee6f4"/><rect x="463" y="177" width="397" height="88" rx="10" fill="#e1eee7"/>
<text x="58" y="210" font-size="21">Adagio → Allegro moderato</text><text x="58" y="246" font-size="19">慢引子 → 不安的快板运动</text><text x="482" y="210" font-size="21">Poco adagio</text><text x="482" y="246" font-size="19">长句 · 管风琴持续支撑</text>
<rect x="40" y="287" width="820" height="52" rx="10" fill="#e0d7ec"/><text x="60" y="321" font-size="23">II · 第二大部分</text>
<rect x="40" y="351" width="397" height="88" rx="10" fill="#eee6f4"/><rect x="463" y="351" width="397" height="88" rx="10" fill="#f2dfbd"/>
<text x="58" y="384" font-size="21">Allegro moderato ↔ Presto</text><text x="58" y="420" font-size="19">谐谑曲性质 · 钢琴的闪光</text><text x="482" y="384" font-size="21">Maestoso → Allegro</text><text x="482" y="420" font-size="19">管风琴宣告 · 继续推进的终曲</text></g></svg>
