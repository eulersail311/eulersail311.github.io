<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-label="固定似然下的先验敏感性"><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:19px;fill:#243c4a}.title{font-size:26px;font-weight:700}.bold{font-weight:700}.small{font-size:17px}.card{fill:#edf5f3;stroke:#9dbeb5;stroke-width:2}.axis{stroke:#a6b8bf;stroke-width:1}</style><rect width="900" height="460" rx="16" fill="#fbfdfc"/><text class="title" x="30" y="45">相同标记率，不同先验会得到不同后验</text><text class="small" x="30" y="80">固定 P(E|H)=0.9、P(E|¬H)=0.05；纵轴为后验概率</text><line class="axis" x1="90" x2="830" y1="380" y2="380"/><text class="small" x="35" y="386">0%</text><line class="axis" x1="90" x2="830" y1="240" y2="240"/><text class="small" x="35" y="246">50%</text><line class="axis" x1="90" x2="830" y1="100" y2="100"/><text class="small" x="35" y="106">100%</text><rect data-prior="0.01" data-posterior="0.15384615384615385" x="150" y="336.9230769230769" width="90" height="43.07692307692308" rx="5" fill="#267e76"/><text class="bold" text-anchor="middle" x="195" y="324.9230769230769">15.38%</text><text text-anchor="middle" x="195" y="412">先验 1%</text><rect data-prior="0.02" data-posterior="0.26865671641791045" x="330" y="304.77611940298505" width="90" height="75.22388059701493" rx="5" fill="#267e76"/><text class="bold" text-anchor="middle" x="375" y="292.77611940298505">26.87%</text><text text-anchor="middle" x="375" y="412">先验 2%</text><rect data-prior="0.1" data-posterior="0.6666666666666667" x="510" y="193.33333333333331" width="90" height="186.66666666666669" rx="5" fill="#267e76"/><text class="bold" text-anchor="middle" x="555" y="181.33333333333331">66.67%</text><text text-anchor="middle" x="555" y="412">先验 10%</text><rect data-prior="0.2" data-posterior="0.8181818181818181" x="690" y="150.90909090909093" width="90" height="229.09090909090907" rx="5" fill="#267e76"/><text class="bold" text-anchor="middle" x="735" y="138.90909090909093">81.82%</text><text text-anchor="middle" x="735" y="412">先验 20%</text><text class="small" x="30" y="447">本图只改变先验；真实总体迁移还可能改变两类标记率。</text></svg>
