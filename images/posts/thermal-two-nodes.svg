<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300"><title>两个储能节点与恒温环境的热网络</title><rect width="900" height="300" fill="#f6f9fc"/><g font-family="Microsoft YaHei,sans-serif" fill="#795428"><text x="35" y="43" font-size="24">两个储能账本，共用一条内部交换通道</text><g fill="#fff" stroke="#976f3c"><rect x="35" y="90" width="220" height="130" rx="12"/><rect x="340" y="90" width="220" height="130" rx="12"/><rect x="645" y="90" width="220" height="130" rx="12"/></g><path d="M255 155 H330 M320 149 L330 155 L320 161 M560 155 H635 M625 149 L635 155 L625 161" fill="none" stroke="#976f3c" stroke-width="2"/><g font-size="21"><text x="55" y="126">节点1：T₁、C₁</text><text x="360" y="126">节点2：T₂、C₂</text><text x="665" y="126">恒温环境T∞</text></g><g font-size="18"><text x="55" y="182">C₁ dT₁/dt</text><text x="360" y="182">C₂ dT₂/dt</text><text x="665" y="182">温度固定</text><text x="275" y="80">G₁₂</text><text x="580" y="80">G₂∞</text><text x="35" y="270">箭头定义热流正向；温差反号时实际热流可反向 · 原创教学模型</text></g></g></svg>
