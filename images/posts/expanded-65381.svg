<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title-65381 desc-65381"><title id="title-65381">只测位置，速度也可能得到校正</title><desc id="desc-65381">人为清零交叉项是在改变模型依赖结构；应同时检查矩阵方向、转置和各状态单位。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#176756"/></marker></defs><rect width="900" height="360" fill="#f8fafc"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#172b45"><text x="36" y="38" font-size="24" font-weight="700">只测位置，速度也可能得到校正</text><text x="36" y="69" font-size="17" fill="#176756">步骤关系：箭头表示本图的处理或观察顺序</text><rect x="36" y="99" width="240" height="175" rx="12" fill="white" stroke="#176756" stroke-width="1.5"/><path d="M48 99 H264" stroke="#176756" stroke-width="4"/><text x="52" y="133" font-size="20" font-weight="700" fill="#176756">预测误差协方差</text><text x="52" y="198" font-size="18">保留位置与速度的交叉项</text><path d="M283 185 H317" stroke="#176756" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="99" width="240" height="175" rx="12" fill="white" stroke="#176756" stroke-width="1.5"/><path d="M342 99 H558" stroke="#176756" stroke-width="4"/><text x="346" y="133" font-size="20" font-weight="700" fill="#176756">位置观测进入</text><text x="346" y="198" font-size="18">增益可传递两种误差关系</text><path d="M577 185 H611" stroke="#176756" stroke-width="2" marker-end="url(#arrow)"/><rect x="624" y="99" width="240" height="175" rx="12" fill="white" stroke="#176756" stroke-width="1.5"/><path d="M636 99 H852" stroke="#176756" stroke-width="4"/><text x="640" y="133" font-size="20" font-weight="700" fill="#176756">速度估计改变</text><text x="640" y="198" font-size="18">并非传感器直接测到了速</text><text x="640" y="228" font-size="18">度</text><text x="36" y="319" font-size="17">依据本文已有情境绘制 · 不表示生产测量或通用性能保证</text></g></svg>
