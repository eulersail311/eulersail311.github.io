<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"><title>图2｜三个限制，三个不同问题</title><rect width="900" height="400" rx="18" fill="#f1f7f8"/><g font-family="Microsoft YaHei,sans-serif" fill="#214d54"><text x="30" y="55" font-size="27" font-weight="700">图2｜三个限制，三个不同问题</text><text x="30" y="94" font-size="18">原创教学示意 · 卡片宽度不表示时间、数量或贡献比例</text><rect x="30" y="130" width="270" height="185" rx="12" fill="white" stroke="#b9d5d9"/><text x="45" y="173" font-size="21" font-weight="700">令牌桶</text><text x="45" y="225" font-size="19">一段时间的费用</text><text x="45" y="271" font-size="19">限制速率与突发</text><rect x="315" y="130" width="270" height="185" rx="12" fill="white" stroke="#b9d5d9"/><text x="330" y="173" font-size="21" font-weight="700">并发上限</text><text x="330" y="225" font-size="19">正在执行的数量</text><text x="330" y="271" font-size="19">限制执行占用</text><rect x="600" y="130" width="270" height="185" rx="12" fill="white" stroke="#b9d5d9"/><text x="615" y="173" font-size="21" font-weight="700">有限队列</text><text x="615" y="225" font-size="19">尚未执行的数量</text><text x="615" y="271" font-size="19">限制等待积压</text><text x="30" y="365" font-size="18">完整条件、单位、推导与边界见正文相应公式和手算表。</text></g></svg>
