<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="块内负相关，合起来仍可能正相关"><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:19px;fill:#183b48}.title{font-size:26px;font-weight:700}.bold{font-weight:700}.small{font-size:17px}.box{fill:#edf7f5;stroke:#8bbeb3;stroke-width:2}</style><rect width="900" height="420" rx="16" fill="#fbfdfc"/><text class="title" x="32" y="44">块内负相关，合起来仍可能正相关</text><rect class="box" x="35" y="85" width="380" height="157" rx="12"/><rect class="box" x="485" y="85" width="380" height="157" rx="12"/><text class="bold" x="58" y="124">A：(1,2)、(2,1)</text><text x="58" y="165">均值 (1.5, 1.5)；C = −0.5</text><text x="58" y="207">n = 2；Sxx = Syy = 0.5；r = −1</text><text class="bold" x="508" y="124">B：(3,4)、(4,3)</text><text x="508" y="165">均值 (3.5, 3.5)；C = −0.5</text><text x="508" y="207">n = 2；Sxx = Syy = 0.5；r = −1</text><text class="bold" x="60" y="292">均值差 Δx = Δy = 2；权重 2×2/4 = 1；跨块修正 = 4</text><rect x="35" y="320" width="830" height="65" rx="12" fill="#d9eee8"/><text class="bold" x="62" y="361">合并：C = −0.5 − 0.5 + 4 = 3；Sxx = Syy = 5；r = 0.6</text></svg>
