<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-label="两千克合成样品的分段吸热曲线"><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:19px;fill:#263c4a}.title{font-size:26px;font-weight:700}.bold{font-weight:700}.small{font-size:17px}.card{fill:#edf5f3;stroke:#9dbeb5;stroke-width:2}</style><rect width="900" height="460" rx="16" fill="#fbfdfc"/><text class="title" x="30" y="42">合成样品：温度与累计净吸热</text><text class="small" x="30" y="95">T/°C</text><path d="M90 110V380H755" fill="none" stroke="#a2b5bc" stroke-width="2"/><line x1="90" x2="755" y1="380" y2="380" stroke="#d6e2e5"/><text class="small" x="40" y="386">20</text><line x1="90" x2="755" y1="260" y2="260" stroke="#d6e2e5"/><text class="small" x="40" y="266">50</text><line x1="90" x2="755" y1="180" y2="180" stroke="#d6e2e5"/><text class="small" x="40" y="186">70</text><text class="small" text-anchor="middle" x="90" y="413">0</text><text class="small" text-anchor="middle" x="204" y="413">60</text><text class="small" text-anchor="middle" x="394" y="413">160</text><text class="small" text-anchor="middle" x="584" y="413">260</text><text class="small" text-anchor="middle" x="736" y="413">340</text><polyline points="90,380 204,260 584,260 736,180" fill="none" stroke="#267e76" stroke-width="4"/><text class="bold" x="255" y="225">熔化平台：f从0变到1</text><text class="small" x="300" y="310">160kJ：50°C，f=0.5</text><circle data-heat-kj="0" data-temperature="20" cx="90" cy="380" r="6" fill="#267e76"/><circle data-heat-kj="60" data-temperature="50" cx="204" cy="260" r="6" fill="#267e76"/><circle data-heat-kj="160" data-temperature="50" cx="394" cy="260" r="6" fill="#267e76"/><circle data-heat-kj="260" data-temperature="50" cx="584" cy="260" r="6" fill="#267e76"/><circle data-heat-kj="340" data-temperature="70" cx="736" cy="180" r="6" fill="#267e76"/><text class="small" x="380" y="447">累计净吸热Q/kJ；横轴不是时间</text></svg>
