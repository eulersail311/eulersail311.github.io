<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc"><title id="title">带 epsilon 的三种雅可比方向</title><desc id="desc">只考虑z对x的导数。平移方向特征值零，中心化方向特征值epsilon q三次方，正交方向特征值q。手算例子分别为零、三分之一、一。</desc><rect width="900" height="500" rx="20" fill="#f4f1fa"/><g font-family="Microsoft YaHei,sans-serif" fill="#3d3454"><text x="40" y="52" font-size="27" font-weight="bold">ε 不是只为避免除零</text><text x="40" y="91" font-size="19">J 表示 z 对 x 的局部导数；本例 c=[−1,0,1]，q=1，ε=1/3</text><g fill="#fff"><rect x="40" y="125" width="260" height="270" rx="14"/><rect x="320" y="125" width="260" height="270" rx="14"/><rect x="600" y="125" width="260" height="270" rx="14"/></g><g text-anchor="middle"><g font-size="24"><text x="170" y="170">平移方向</text><text x="450" y="170">中心化方向</text><text x="730" y="170">其余正交方向</text></g><g font-size="20"><text x="170" y="220">1=[1,1,1]</text><text x="450" y="220">c=[−1,0,1]</text><text x="730" y="220">w=[1,−2,1]</text><text x="170" y="277">J1=0</text><text x="450" y="277">Jc=εq³c</text><text x="730" y="277">Jw=q w</text></g><g font-size="34" fill="#6a4e93"><text x="170" y="335">×0</text><text x="450" y="335">×1/3</text><text x="730" y="335">×1</text></g><g font-size="18"><text x="170" y="374">给全行加常数被抵消</text><text x="450" y="374">尺度方向仍可能有梯度</text><text x="730" y="374">同时垂直于 1 和 c</text></g></g><text x="40" y="441" font-size="19">完整反向先计算 h=γ⊙g，再使用 dx=Jh；图中 J 尚未包含仿射参数。</text><text x="40" y="476" font-size="18">原创解析关系图，不是训练曲线，也不表示所有方向的梯度都被压成零。</text></g></svg>
