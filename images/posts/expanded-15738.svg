<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title-15738 desc-15738"><title id="title-15738">一次请求的证据分层到哪里</title><desc id="desc-15738">TCP已建立只能排除相应阶段的部分问题；代理、本机与源站的观测位置也要分开。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#1c6275"/></marker></defs><rect width="900" height="360" fill="#f8fafc"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#172b45"><text x="36" y="38" font-size="24" font-weight="700">一次请求的证据分层到哪里</text><text x="36" y="69" font-size="17" fill="#1c6275">步骤关系：箭头表示本图的处理或观察顺序</text><rect x="36" y="99" width="240" height="175" rx="12" fill="white" stroke="#1c6275" stroke-width="1.5"/><path d="M48 99 H264" stroke="#1c6275" stroke-width="4"/><text x="52" y="133" font-size="20" font-weight="700" fill="#1c6275">名称与连接</text><text x="52" y="198" font-size="18">核对解析地址和TCP目标</text><path d="M283 185 H317" stroke="#1c6275" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="99" width="240" height="175" rx="12" fill="white" stroke="#1c6275" stroke-width="1.5"/><path d="M342 99 H558" stroke="#1c6275" stroke-width="4"/><text x="346" y="133" font-size="20" font-weight="700" fill="#1c6275">TLS与HTTP</text><text x="346" y="198" font-size="18">再查身份校验路由与状态</text><path d="M577 185 H611" stroke="#1c6275" stroke-width="2" marker-end="url(#arrow)"/><rect x="624" y="99" width="240" height="175" rx="12" fill="white" stroke="#1c6275" stroke-width="1.5"/><path d="M636 99 H852" stroke="#1c6275" stroke-width="4"/><text x="640" y="133" font-size="20" font-weight="700" fill="#1c6275">应用正文</text><text x="640" y="198" font-size="18">确认返回内容满足当前请</text><text x="640" y="228" font-size="18">求</text><text x="36" y="319" font-size="17">依据本文已有情境绘制 · 不表示生产测量或通用性能保证</text></g></svg>
