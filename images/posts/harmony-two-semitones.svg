<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">G7 到 C：两条半音解决</title><desc id="desc">在 C 大调教学例子中，G7 的 B 上行半音到 C，F 下行半音到 E。仅展示两个倾向音，非完整四部和声。</desc><rect width="900" height="420" rx="20" fill="#faf5ee"/><g font-family="Microsoft YaHei, sans-serif" fill="#49344b"><text x="40" y="52" font-size="27" font-weight="bold">和声方向，听声部怎样移动</text><text x="40" y="91" font-size="19">自拟 C 大调示意 · 只抽取两个倾向音，不是完整四部配置</text><rect x="55" y="128" width="250" height="202" rx="14" fill="#eee6f4"/><rect x="595" y="128" width="250" height="202" rx="14" fill="#e1eee7"/><g font-size="25" text-anchor="middle"><text x="180" y="170">G7：G–B–D–F</text><text x="720" y="170">C：C–E–G</text><text x="180" y="233">B</text><text x="720" y="233">C</text><text x="180" y="298">F</text><text x="720" y="298">E</text></g><path d="M285 224 H608 M596 216 L608 224 L596 232 M285 289 H608 M596 281 L608 289 L596 297" fill="none" stroke="#936344" stroke-width="3"/><g font-size="19" text-anchor="middle"><text x="450" y="211">上行半音</text><text x="450" y="276">下行半音</text></g><text x="55" y="378" font-size="19">听觉练习：先跟住一条声部，再听两条线怎样共同指向解决。</text></g></svg>
