<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title-70624 desc-70624"><title id="title-70624">知识地图的三类入口各负其责</title><desc id="desc-70624">从一个真实问题尝试走到答案，能检查缺失的语义连接；庞大标签不能代替全部结构。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#665027"/></marker></defs><rect width="900" height="360" fill="#f8fafc"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#172b45"><text x="36" y="38" font-size="24" font-weight="700">知识地图的三类入口各负其责</text><text x="36" y="69" font-size="17" fill="#665027">并列对照：卡片宽度不表示数量、时长或比例</text><rect x="36" y="99" width="240" height="175" rx="12" fill="white" stroke="#665027" stroke-width="1.5"/><path d="M48 99 H264" stroke="#665027" stroke-width="4"/><text x="52" y="133" font-size="20" font-weight="700" fill="#665027">分类</text><text x="52" y="198" font-size="18">提供长期主题位置</text><rect x="330" y="99" width="240" height="175" rx="12" fill="white" stroke="#665027" stroke-width="1.5"/><path d="M342 99 H558" stroke="#665027" stroke-width="4"/><text x="346" y="133" font-size="20" font-weight="700" fill="#665027">标签</text><text x="346" y="198" font-size="18">聚合同类缓存问题</text><rect x="624" y="99" width="240" height="175" rx="12" fill="white" stroke="#665027" stroke-width="1.5"/><path d="M636 99 H852" stroke="#665027" stroke-width="4"/><text x="640" y="133" font-size="20" font-weight="700" fill="#665027">正文链接</text><text x="640" y="198" font-size="18">解释LRU淘汰与HTTP复用</text><text x="640" y="228" font-size="18">的区别</text><text x="36" y="319" font-size="17">依据本文已有情境绘制 · 不表示生产测量或通用性能保证</text></g></svg>
