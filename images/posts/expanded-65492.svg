<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title-65492 desc-65492"><title id="title-65492">单位改变会重新分配PCA中的尺度</title><desc id="desc-65492">物理对象没有改变，原始PCA方向却可能改变；标准化是另一种目标赋权，不是无代价修复。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#176756"/></marker></defs><rect width="900" height="360" fill="#f8fafc"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#172b45"><text x="36" y="38" font-size="24" font-weight="700">单位改变会重新分配PCA中的尺度</text><text x="36" y="69" font-size="17" fill="#176756">步骤关系：箭头表示本图的处理或观察顺序</text><rect x="36" y="99" width="240" height="175" rx="12" fill="white" stroke="#176756" stroke-width="1.5"/><path d="M48 99 H264" stroke="#176756" stroke-width="4"/><text x="52" y="133" font-size="20" font-weight="700" fill="#176756">米改成毫米</text><text x="52" y="198" font-size="18">数值放大1000倍</text><path d="M283 185 H317" stroke="#176756" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="99" width="240" height="175" rx="12" fill="white" stroke="#176756" stroke-width="1.5"/><path d="M342 99 H558" stroke="#176756" stroke-width="4"/><text x="346" y="133" font-size="20" font-weight="700" fill="#176756">原始协方差</text><text x="346" y="198" font-size="18">对应方差放大一百万倍</text><path d="M577 185 H611" stroke="#176756" stroke-width="2" marker-end="url(#arrow)"/><rect x="624" y="99" width="240" height="175" rx="12" fill="white" stroke="#176756" stroke-width="1.5"/><path d="M636 99 H852" stroke="#176756" stroke-width="4"/><text x="640" y="133" font-size="20" font-weight="700" fill="#176756">选择预处理</text><text x="640" y="198" font-size="18">先明确绝对量纲还是相对</text><text x="640" y="228" font-size="18">变化</text><text x="36" y="319" font-size="17">依据本文已有情境绘制 · 不表示生产测量或通用性能保证</text></g></svg>
