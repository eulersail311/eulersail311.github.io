<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title-70846 desc-70846"><title id="title-70846">保留原回答，才看得见提取缺口</title><desc id="desc-70846">只回答为了公平还缺少规则层面的解释；复习应保留原答案和改判依据。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#665027"/></marker></defs><rect width="900" height="360" fill="#f8fafc"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#172b45"><text x="36" y="38" font-size="24" font-weight="700">保留原回答，才看得见提取缺口</text><text x="36" y="69" font-size="17" fill="#665027">步骤关系：箭头表示本图的处理或观察顺序</text><rect x="36" y="99" width="240" height="175" rx="12" fill="white" stroke="#665027" stroke-width="1.5"/><path d="M48 99 H264" stroke="#665027" stroke-width="4"/><text x="52" y="133" font-size="20" font-weight="700" fill="#665027">合上文章回答</text><text x="52" y="198" font-size="18">解释同分样本为何一起纳</text><text x="52" y="228" font-size="18">入</text><path d="M283 185 H317" stroke="#665027" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="99" width="240" height="175" rx="12" fill="white" stroke="#665027" stroke-width="1.5"/><path d="M342 99 H558" stroke="#665027" stroke-width="4"/><text x="346" y="133" font-size="20" font-weight="700" fill="#665027">对照原理</text><text x="346" y="198" font-size="18">同一阈值给同分样本同一</text><text x="346" y="228" font-size="18">决定</text><path d="M577 185 H611" stroke="#665027" stroke-width="2" marker-end="url(#arrow)"/><rect x="624" y="99" width="240" height="175" rx="12" fill="white" stroke="#665027" stroke-width="1.5"/><path d="M636 99 H852" stroke="#665027" stroke-width="4"/><text x="640" y="133" font-size="20" font-weight="700" fill="#665027">换例再检查</text><text x="640" y="198" font-size="18">修订理由而非直接抄标准</text><text x="640" y="228" font-size="18">句</text><text x="36" y="319" font-size="17">依据本文已有情境绘制 · 不表示生产测量或通用性能保证</text></g></svg>
