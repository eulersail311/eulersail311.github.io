<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-label="五点树的颜色与开放块状态"><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:19px;fill:#263c4a}.title{font-size:26px;font-weight:700}.bold{font-weight:700}.small{font-size:17px}.card{fill:#edf5f3;stroke:#9dbeb5;stroke-width:2}</style><rect width="900" height="460" rx="16" fill="#fbfdfc"/><text class="title" x="30" y="38">五点手算：括号表示(F₀,F₁)，不表示颜色数量</text><line x1="450" y1="100" x2="260" y2="225" stroke="#78969a" stroke-width="3"/><line x1="450" y1="100" x2="650" y2="225" stroke="#78969a" stroke-width="3"/><line x1="260" y1="225" x2="140" y2="360" stroke="#78969a" stroke-width="3"/><line x1="260" y1="225" x2="380" y2="360" stroke="#78969a" stroke-width="3"/><g data-node="0" data-zero="3" data-one="5"><circle cx="450" cy="100" r="23" fill="#fff" stroke="#364d58" stroke-width="2"/><text text-anchor="middle" x="450" y="106" style="fill:#263c4a">0</text><text class="bold" x="490" y="105">(3,5)</text></g><g data-node="1" data-zero="1" data-one="2"><circle cx="260" cy="225" r="23" fill="#fff" stroke="#364d58" stroke-width="2"/><text text-anchor="middle" x="260" y="231" style="fill:#263c4a">1</text><text class="bold" x="300" y="230">(1,2)</text></g><g data-node="2" data-zero="0" data-one="1"><circle cx="650" cy="225" r="23" fill="#364d58" stroke="#364d58" stroke-width="2"/><text text-anchor="middle" x="650" y="231" style="fill:#fff">2</text><text class="bold" x="690" y="230">(0,1)</text></g><g data-node="3" data-zero="0" data-one="1"><circle cx="140" cy="360" r="23" fill="#364d58" stroke="#364d58" stroke-width="2"/><text text-anchor="middle" x="140" y="366" style="fill:#fff">3</text><text class="bold" x="180" y="365">(0,1)</text></g><g data-node="4" data-zero="0" data-one="1"><circle cx="380" cy="360" r="23" fill="#364d58" stroke="#364d58" stroke-width="2"/><text text-anchor="middle" x="380" y="366" style="fill:#fff">4</text><text class="bold" x="420" y="365">(0,1)</text></g><text class="small" x="30" y="435">黑点为2、3、4；根的F₀=3仍未完成，最终答案只取F₁=5。</text></svg>
