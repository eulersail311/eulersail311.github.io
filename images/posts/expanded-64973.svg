<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title-64973 desc-64973"><title id="title-64973">标准化改变比较口径，不改原始记录</title><desc id="desc-64973">在看见谁更好之后才挑权重，会退化为选择性展示；目标构成需要先说明。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#176756"/></marker></defs><rect width="900" height="360" fill="#f8fafc"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#172b45"><text x="36" y="38" font-size="24" font-weight="700">标准化改变比较口径，不改原始记录</text><text x="36" y="69" font-size="17" fill="#176756">步骤关系：箭头表示本图的处理或观察顺序</text><rect x="36" y="99" width="240" height="175" rx="12" fill="white" stroke="#176756" stroke-width="1.5"/><path d="M48 99 H264" stroke="#176756" stroke-width="4"/><text x="52" y="133" font-size="20" font-weight="700" fill="#176756">保留组内表现</text><text x="52" y="198" font-size="18">难任务与易任务分别计算</text><path d="M283 185 H317" stroke="#176756" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="99" width="240" height="175" rx="12" fill="white" stroke="#176756" stroke-width="1.5"/><path d="M342 99 H558" stroke="#176756" stroke-width="4"/><text x="346" y="133" font-size="20" font-weight="700" fill="#176756">指定共同权重</text><text x="346" y="198" font-size="18">例如两组各占二分之一</text><path d="M577 185 H611" stroke="#176756" stroke-width="2" marker-end="url(#arrow)"/><rect x="624" y="99" width="240" height="175" rx="12" fill="white" stroke="#176756" stroke-width="1.5"/><path d="M636 99 H852" stroke="#176756" stroke-width="4"/><text x="640" y="133" font-size="20" font-weight="700" fill="#176756">再汇总比较</text><text x="640" y="198" font-size="18">解释这套权重代表的目标</text><text x="640" y="228" font-size="18">人群</text><text x="36" y="319" font-size="17">依据本文已有情境绘制 · 不表示生产测量或通用性能保证</text></g></svg>
