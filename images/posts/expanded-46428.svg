<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title-46428 desc-46428"><title id="title-46428">AAAA无数据不等于名称不存在</title><desc id="desc-46428">缓存键保留名称、类型与类等身份字段，避免把类型缺失错误扩大到名称范围。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#1c6275"/></marker></defs><rect width="900" height="360" fill="#f8fafc"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#172b45"><text x="36" y="38" font-size="24" font-weight="700">AAAA无数据不等于名称不存在</text><text x="36" y="69" font-size="17" fill="#1c6275">并列对照：卡片宽度不表示数量、时长或比例</text><rect x="36" y="99" width="240" height="175" rx="12" fill="white" stroke="#1c6275" stroke-width="1.5"/><path d="M48 99 H264" stroke="#1c6275" stroke-width="4"/><text x="52" y="133" font-size="20" font-weight="700" fill="#1c6275">同名A查询</text><text x="52" y="198" font-size="18">仍可能存在合法地址记录</text><rect x="330" y="99" width="240" height="175" rx="12" fill="white" stroke="#1c6275" stroke-width="1.5"/><path d="M342 99 H558" stroke="#1c6275" stroke-width="4"/><text x="346" y="133" font-size="20" font-weight="700" fill="#1c6275">AAAA否定结果</text><text x="346" y="198" font-size="18">只在相应类型范围内记账</text><rect x="624" y="99" width="240" height="175" rx="12" fill="white" stroke="#1c6275" stroke-width="1.5"/><path d="M636 99 H852" stroke="#1c6275" stroke-width="4"/><text x="640" y="133" font-size="20" font-weight="700" fill="#1c6275">TTL耗尽</text><text x="640" y="198" font-size="18">需要新证据，不代表此刻</text><text x="640" y="228" font-size="18">必有变化</text><text x="36" y="319" font-size="17">依据本文已有情境绘制 · 不表示生产测量或通用性能保证</text></g></svg>
