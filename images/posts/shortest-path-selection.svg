<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc"><title id="title">最短路算法选择中的三个问题</title><desc id="desc">BFS 处理等权，0-1 BFS 处理零一权，Dijkstra 处理非负权单源，Floyd 适合稠密小图全点对；还要考虑查询与操作顺序。</desc><rect width="900" height="400" rx="20" fill="#f4f7fb"/><g font-family="Microsoft YaHei, sans-serif" fill="#18364a"><text x="40" y="50" font-size="27" font-weight="bold">先问边权，再问源点与操作顺序</text><g font-size="21"><text x="45" y="112">边权相同</text><text x="350" y="112">BFS</text><text x="565" y="112">逐层扩张</text><text x="45" y="172">只有 0 与 1</text><text x="350" y="172">0-1 BFS</text><text x="565" y="172">双端队列分层</text><text x="45" y="232">非负权，单源</text><text x="350" y="232">Dijkstra</text><text x="565" y="232">确定当前最近点</text><text x="45" y="292">小型稠密图，全点对</text><text x="350" y="292">Floyd</text><text x="565" y="292">逐层放开中间点</text></g><path d="M40 132 H860 M40 192 H860 M40 252 H860 M40 312 H860" stroke="#c6d5e1"/><text x="45" y="357" font-size="19">295B 还利用“已知全部删除顺序”；此图不是所有最短路算法的完整决策树。</text></g></svg>
