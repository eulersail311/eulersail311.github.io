<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">筛选集合与遗漏误差</title><desc id="desc">索引先筛选，保留项重新归一化，遗漏质量和误差需要独立核对。</desc><rect width="900" height="360" rx="16" fill="#f5f3fb"/><g font-family="Microsoft YaHei, sans-serif" fill="#362d61"><text x="28" y="42" font-size="24" font-weight="bold">选择哪些历史，与怎样汇总历史分别检查</text><g fill="#e9e3f8" stroke="#8273b1"><rect x="28" y="70" width="258" height="180" rx="12"/><rect x="320" y="70" width="258" height="180" rx="12"/><rect x="612" y="70" width="260" height="180" rx="12"/></g><g font-size="20"><text x="46" y="106" font-weight="bold">索引：得到候选 S</text><text x="46" y="148">采用较便宜的排名</text><text x="46" y="184">保留非空允许集合</text><text x="46" y="222">索引分数不等于概率</text><text x="338" y="106" font-weight="bold">汇总：重新归一化</text><text x="338" y="148">只在 S 内计算输出</text><text x="338" y="184">内部权重之和为 1</text><text x="338" y="222">不代表遗漏质量为 0</text><text x="630" y="106" font-weight="bold">参考：检查遗漏质量</text><text x="630" y="148">δ 来自完整分布</text><text x="630" y="184">误差还取决于值尺度</text><text x="630" y="222">以及两侧值的差异</text></g><text x="28" y="292" font-size="20">p = [0.99, 0.01]，v = [0, 1000]：只保留首项，输出误差为 10。</text><text x="28" y="330" font-size="18">原创合成案例；等宽框不表示延迟。没有值尺度条件就没有绝对误差保证。</text></g></svg>
