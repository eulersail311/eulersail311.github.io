<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">482B 的逐位区间覆盖与最小候选</title>
  <desc id="desc">三条区间 AND 约束分别为一至三等于二、二至四等于六、三至五等于四。把目标一位覆盖的位置标出，合并后得到数组二、六、六、六、四。</desc>
  <rect width="900" height="560" rx="20" fill="#f5f8fc"/>
  <g font-family="system-ui, 'Microsoft YaHei', sans-serif" fill="#172b46">
    <text x="36" y="48" font-size="25" font-weight="700">先收集不可撤销的一，再把其他位留成零</text>
    <text x="36" y="79" font-size="16" fill="#50627b">原创例子 · 三条 AND 等式 · 只画低三位，其他位均为零</text>
    <rect x="32" y="102" width="836" height="104" rx="12" fill="#fff" stroke="#ced9e8"/>
    <text x="52" y="135" font-size="18">[1,3] → 2 = 010</text>
    <text x="327" y="135" font-size="18">[2,4] → 6 = 110</text>
    <text x="602" y="135" font-size="18">[3,5] → 4 = 100</text>
    <text x="52" y="177" font-size="16" fill="#50627b">目标某位为一 → 区间中的每个位置都必须把这一位设为一</text>
    <text x="39" y="246" font-size="17" font-weight="700">强制位 / 位置</text>
    <g font-size="19" text-anchor="middle" font-weight="700">
      <text x="320" y="246">1</text><text x="430" y="246">2</text><text x="540" y="246">3</text><text x="650" y="246">4</text><text x="760" y="246">5</text>
    </g>
    <g font-size="17"><text x="39" y="293">数值 4 的位</text><text x="39" y="349">数值 2 的位</text><text x="39" y="405">数值 1 的位</text></g>
    <g stroke="#c9d4e2" fill="#fff">
      <rect x="275" y="265" width="90" height="42" rx="8"/>
      <rect x="385" y="265" width="90" height="42" rx="8" fill="#d8ecfb" stroke="#3181b2"/>
      <rect x="495" y="265" width="90" height="42" rx="8" fill="#d8ecfb" stroke="#3181b2"/>
      <rect x="605" y="265" width="90" height="42" rx="8" fill="#d8ecfb" stroke="#3181b2"/>
      <rect x="715" y="265" width="90" height="42" rx="8" fill="#d8ecfb" stroke="#3181b2"/>
      <rect x="275" y="321" width="90" height="42" rx="8" fill="#dcf1e5" stroke="#28835b"/>
      <rect x="385" y="321" width="90" height="42" rx="8" fill="#dcf1e5" stroke="#28835b"/>
      <rect x="495" y="321" width="90" height="42" rx="8" fill="#dcf1e5" stroke="#28835b"/>
      <rect x="605" y="321" width="90" height="42" rx="8" fill="#dcf1e5" stroke="#28835b"/>
      <rect x="715" y="321" width="90" height="42" rx="8"/>
      <rect x="275" y="377" width="90" height="42" rx="8"/>
      <rect x="385" y="377" width="90" height="42" rx="8"/>
      <rect x="495" y="377" width="90" height="42" rx="8"/>
      <rect x="605" y="377" width="90" height="42" rx="8"/>
      <rect x="715" y="377" width="90" height="42" rx="8"/>
    </g>
    <g font-size="21" text-anchor="middle" font-weight="700">
      <text x="320" y="294">0</text><text x="430" y="294">1</text><text x="540" y="294">1</text><text x="650" y="294">1</text><text x="760" y="294">1</text>
      <text x="320" y="350">1</text><text x="430" y="350">1</text><text x="540" y="350">1</text><text x="650" y="350">1</text><text x="760" y="350">0</text>
      <text x="320" y="406">0</text><text x="430" y="406">0</text><text x="540" y="406">0</text><text x="650" y="406">0</text><text x="760" y="406">0</text>
    </g>
    <path d="M36 440H864" stroke="#c9d4e2"/>
    <text x="39" y="479" font-size="18" font-weight="700">拼回十进制</text>
    <g font-size="25" text-anchor="middle" fill="#a44820" font-weight="700"><text x="320" y="481">2</text><text x="430" y="481">6</text><text x="540" y="481">6</text><text x="650" y="481">6</text><text x="760" y="481">4</text></g>
    <text x="39" y="530" font-size="16" fill="#50627b">核验：2 &amp; 6 &amp; 6 = 2；6 &amp; 6 &amp; 6 = 6；6 &amp; 6 &amp; 4 = 4</text>
  </g>
</svg>
