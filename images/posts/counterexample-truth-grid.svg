<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="有效反例：前提成立，结论却失败"><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:19px;fill:#253b4b}.title{font-size:26px;font-weight:700}.bold{font-weight:700}.small{font-size:17px}.card{fill:#edf5f3;stroke:#9abfb4;stroke-width:2}</style><rect width="900" height="420" rx="16" fill="#fbfdfc"/><text class="title" x="30" y="45">有效反例：前提成立，结论却失败</text><rect x="35" y="95" width="400" height="125" rx="12" fill="#edf5f3" stroke="#9abfb4" stroke-width="2"/><text class="bold" x="57" y="126">A 真 / B 真：一个支持例子</text><text x="57" y="177">不能由一次成立推出全部成立</text><rect x="465" y="95" width="400" height="125" rx="12" fill="#fff0e5" stroke="#bd7044" stroke-width="2"/><text class="bold" x="487" y="126">A 真 / B 假：这是有效反例</text><text x="487" y="177">保留前提，独立核对结论失败</text><rect x="35" y="240" width="400" height="125" rx="12" fill="#edf5f3" stroke="#9abfb4" stroke-width="2"/><text class="bold" x="57" y="271">A 假 / B 真：没有满足前提</text><text x="57" y="322">不在这条条件保证的范围内</text><rect x="465" y="240" width="400" height="125" rx="12" fill="#edf5f3" stroke="#9abfb4" stroke-width="2"/><text class="bold" x="487" y="271">A 假 / B 假：没有满足前提</text><text x="487" y="322">范围外失败不能推翻条件保证</text><text class="small" x="35" y="401">四格表示逻辑情况，不代表发生次数或成功概率。</text></svg>
