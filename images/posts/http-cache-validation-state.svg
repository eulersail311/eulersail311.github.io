<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="title desc"><title id="title">304 保留正文，200 带来新表示</title><desc id="desc">已保存v1正文与验证器，条件请求后304只能更新按验证器识别的已有条目并保留正文，200则使用新正文和元数据。两者仍需按新存储规则处理。</desc><rect width="900" height="460" rx="20" fill="#eff5fa"/><g font-family="Microsoft YaHei,sans-serif" fill="#24415b"><text x="40" y="52" font-size="27" font-weight="bold">条件验证不是把页面变成空白</text><text x="40" y="91" font-size="19">前提：请求选中正确变体，验证器能识别已有表示</text><g fill="#fff"><rect x="40" y="124" width="250" height="244" rx="14"/><rect x="325" y="124" width="250" height="244" rx="14"/><rect x="610" y="124" width="250" height="244" rx="14"/></g><g font-size="23"><text x="60" y="163">已有条目</text><text x="345" y="163">收到304</text><text x="630" y="163">收到200</text></g><g font-size="19"><text x="60" y="211">正文：v1的页面</text><text x="60" y="251">ETag："v1"</text><text x="60" y="291">本次需要验证</text><text x="60" y="331">发送条件请求</text><text x="345" y="211">保留匹配的旧正文</text><text x="345" y="251">更新适用元数据</text><text x="345" y="291">重新计算响应年龄</text><text x="345" y="331">并非年龄必为零</text><text x="630" y="211">使用新的响应正文</text><text x="630" y="251">采用新的元数据</text><text x="630" y="291">检查是否允许保存</text><text x="630" y="331">no-store时不保存</text></g><text x="40" y="410" font-size="19">304 本身不提供表示正文；没有可识别的已有表示，就不能凭空恢复页面。</text><text x="40" y="442" font-size="18">原创协议状态示意，不是某浏览器的实测请求记录；细节以 RFC 更新与选择规则为准。</text></g></svg>
