<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="t"><title id="t">从硬约束到代价与待验证假设</title><rect width="900" height="300" fill="#f6f9fc"/><g font-family="Microsoft YaHei,sans-serif" fill="#25364b"><text x="35" y="45" font-size="25" font-weight="700">先保留条件，再解释选择</text><g fill="#fff" stroke="#806027"><rect x="35" y="78" width="260" height="155" rx="12"/><rect x="320" y="78" width="260" height="155" rx="12"/><rect x="605" y="78" width="260" height="155" rx="12"/></g><g font-size="22" font-weight="700"><text x="55" y="115">硬约束</text><text x="340" y="115">接受的代价</text><text x="625" y="115">待验证假设</text></g><g font-size="18"><text x="55" y="160">断网仍能查询</text><text x="55" y="195">不满足则排除唯一路径</text><text x="340" y="160">资料随包更新</text><text x="340" y="195">明确延迟与责任</text><text x="625" y="160">更新节奏可以接受</text><text x="625" y="195">需要需求方确认</text></g><text x="35" y="273" font-size="17">原创教学场景 · 并列区域表示推理层次，不表示数量或评分</text></g></svg>
