<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-label="微批计算和窗口更新的操作边界"><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:19px;fill:#263c4a}.title{font-size:26px;font-weight:700}.bold{font-weight:700}.small{font-size:17px}.card{fill:#edf5f3;stroke:#9dbeb5;stroke-width:2}</style><rect width="900" height="440" rx="16" fill="#fbfdfc"/><text class="title" x="30" y="42">同一累积窗口：先合成，再更新</text><rect class="card" x="30" y="100" width="180" height="235" rx="12"/><text class="bold" x="46" y="155">固定参数</text><text class="small" x="46" y="225">分批计算梯度</text><text class="small" x="46" y="285">窗口内不step</text><path d="M216 205h27l-6 -5m6 5l-6 5" fill="none" stroke="#267e76" stroke-width="2"/><rect class="card" x="250" y="100" width="180" height="235" rx="12"/><text class="bold" x="266" y="155">加权合成</text><text class="small" x="266" y="225">核对实际分母</text><text class="small" x="266" y="285">收齐本窗口贡献</text><path d="M436 205h27l-6 -5m6 5l-6 5" fill="none" stroke="#267e76" stroke-width="2"/><rect class="card" x="470" y="100" width="180" height="235" rx="12"/><text class="bold" x="486" y="155">窗口后处理</text><text class="small" x="486" y="225">AMP时先反缩放</text><text class="small" x="486" y="285">再按需裁剪</text><path d="M656 205h27l-6 -5m6 5l-6 5" fill="none" stroke="#267e76" stroke-width="2"/><rect class="card" x="690" y="100" width="180" height="235" rx="12"/><text class="bold" x="706" y="155">一次更新</text><text class="small" x="706" y="225">记录更新计数</text><text class="small" x="706" y="285">清梯度后进下一窗</text><text class="small" x="30" y="397">AMP框为操作边界说明，不是框架代码；框宽不表示执行时间。</text></svg>
