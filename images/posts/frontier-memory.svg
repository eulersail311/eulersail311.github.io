<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">关联记忆的写入与读取</title><desc id="desc">键值误差驱动记忆写入，查询读取当前映射，会话边界还需处理更新状态。</desc><rect width="900" height="360" rx="16" fill="#f5f3fb"/><g font-family="Microsoft YaHei, sans-serif" fill="#362d61"><text x="28" y="42" font-size="24" font-weight="bold">当前流的关联，写进可更新的映射</text><g fill="#e9e3f8" stroke="#8273b1"><rect x="28" y="70" width="258" height="180" rx="12"/><rect x="320" y="70" width="258" height="180" rx="12"/><rect x="612" y="70" width="260" height="180" rx="12"/></g><g font-size="20"><text x="46" y="106" font-weight="bold">写入：键 k 与值 v</text><text x="46" y="148">比较预测与目标</text><text x="46" y="184">计算内部损失梯度</text><text x="46" y="222">修改记忆参数</text><text x="338" y="106" font-weight="bold">读取：查询 q</text><text x="338" y="148">使用当前映射 M(q)</text><text x="338" y="184">此操作不做写入</text><text x="338" y="222">结果依赖此前状态</text><text x="630" y="106" font-weight="bold">边界：会话重置</text><text x="630" y="148">参数、动量与缓存</text><text x="630" y="184">分别定义保留或重置</text><text x="630" y="222">不能只调整一个门</text></g><text x="28" y="292" font-size="20">碰撞键案例：w 从 0 → 1 → −1/2；原关联可能被后续写入干扰。</text><text x="28" y="330" font-size="18">原创教学图；不是完整Titans架构，也不表示存储比例或硬件时间。</text></g></svg>
