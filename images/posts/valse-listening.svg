<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280"><title>圆舞曲的三层复听任务</title><rect width="900" height="280" fill="#f6f9fc"/><g font-family="Microsoft YaHei,sans-serif" fill="#653954"><text x="35" y="42" font-size="24">从舞步参照，到关系变化</text><g fill="#fff" stroke="#8a496f"><rect x="35" y="75" width="260" height="140" rx="12"/><rect x="320" y="75" width="260" height="140" rx="12"/><rect x="605" y="75" width="260" height="140" rx="12"/></g><g font-size="22" font-weight="700"><text x="55" y="112">低音参照</text><text x="340" y="112">旋律句尾</text><text x="625" y="112">重音与织体</text></g><g font-size="18"><text x="55" y="155">能否连续跟随重心</text><text x="340" y="155">收住、延续或被打断</text><text x="625" y="155">密度不等于拍速</text><text x="35" y="252">原创复听示意 · 不是谱例、波形或演出时间轴</text></g></g></svg>
