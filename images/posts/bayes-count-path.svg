<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="从总体到标记组，分母随条件改变"><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:19px;fill:#243c4a}.title{font-size:26px;font-weight:700}.bold{font-weight:700}.small{font-size:17px}.card{fill:#edf5f3;stroke:#9dbeb5;stroke-width:2}.axis{stroke:#a6b8bf;stroke-width:1}</style><rect width="900" height="420" rx="16" fill="#fbfdfc"/><text class="title" x="30" y="45">从总体到标记组：分母随条件改变</text><rect class="card" x="30" y="110" width="240" height="220" rx="12"/><text class="bold" x="50" y="155">总体：10000件</text><text x="50" y="215">缺陷先验 2%</text><text class="small" x="50" y="275">先固定来源总体</text><rect class="card" x="330" y="90" width="240" height="115" rx="12"/><text class="bold" x="350" y="130">缺陷 200件</text><text x="350" y="175">标记 180件（90%）</text><rect class="card" x="330" y="235" width="240" height="115" rx="12"/><text class="bold" x="350" y="275">非缺陷 9800件</text><text x="350" y="320">标记 490件（5%）</text><path d="M275 220L320 150M275 220L320 285M580 150L620 220M580 285L620 220" fill="none" stroke="#217c75" stroke-width="3"/><rect class="card" x="630" y="110" width="240" height="220" rx="12"/><text class="bold" x="650" y="155">标记组：670件</text><text x="650" y="215">缺陷占 180/670</text><text x="650" y="275">约 26.865672%</text><text class="small" x="30" y="390">合成概率的等比例展开；框面积和箭头宽度不表示数量。</text></svg>
