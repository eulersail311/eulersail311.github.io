<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">AdamW 与 Adam 加 L2 的首步算术对照</title><desc id="desc">相同初值2和2、数据梯度1和4。AdamW保留数据梯度的矩状态并独立乘0.98，结果1.8933333和1.8711111；Adam加L2先把梯度变为1.4和4.4，结果1.9263158和1.9102041。</desc>
<defs><style>text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;fill:#352d46}.title{font-size:28px;font-weight:700}.sub{font-size:17px;fill:#655b76}.head{font-size:23px;font-weight:700}.body{font-size:19px}.small{font-size:17px}.result{font-size:21px;font-weight:700;fill:#67468b}</style></defs>
<rect width="900" height="520" rx="18" fill="#faf8fc"/><text x="36" y="48" class="title">同名 λ、同一初值，更新路径已经不同</text><text x="36" y="80" class="sub">θ₀ = (2, 2)，g₁ = (1, 4)，β₁ = β₂ = 0.5，α = 0.1，λ = 0.2，ε = 0.5</text>
<rect x="36" y="110" width="396" height="300" rx="14" fill="#eee6f5"/><rect x="468" y="110" width="396" height="300" rx="14" fill="#f1edf5"/>
<text x="58" y="150" class="head">AdamW：独立衰减</text><text x="490" y="150" class="head">Adam 加 L2：先改梯度</text>
<g class="body"><text x="58" y="192">进入状态：g = (1, 4)</text><text x="58" y="230">m̂ = (1, 4)，v̂ = (1, 16)</text><text x="58" y="268">旧参数 × 0.98 = (1.96, 1.96)</text><text x="58" y="306">再减 (0.0666667, 0.0888889)</text>
<text x="490" y="192">增广梯度：(1.4, 4.4)</text><text x="490" y="230">m̂ = (1.4, 4.4)</text><text x="490" y="268">v̂ = (1.96, 19.36)</text><text x="490" y="306">没有额外乘一次 0.98</text></g>
<text x="58" y="361" class="result">θ₁ ≈ (1.8933333, 1.8711111)</text><text x="490" y="361" class="result">θ₁ ≈ (1.9263158, 1.9102041)</text>
<text x="36" y="449" class="body">L2 项会进入一阶与二阶矩；AdamW 的 λ 不直接进入这两个递推。</text><text x="36" y="486" class="sub">原创确定性手算，较大的 ε 用于清楚展示括号约定；不是调参建议或泛化对比。</text>
</svg>
