<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"><title>图1｜逐条更新的三个状态</title><rect width="900" height="400" rx="18" fill="#f1f7f8"/><g font-family="Microsoft YaHei,sans-serif" fill="#214d54"><text x="30" y="55" font-size="27" font-weight="700">图1｜逐条更新的三个状态</text><text x="30" y="94" font-size="18">原创教学示意 · 卡片宽度不表示时间、数量或贡献比例</text><rect x="30" y="130" width="198.75" height="185" rx="12" fill="white" stroke="#b9d5d9"/><text x="45" y="173" font-size="21" font-weight="700">x=2</text><text x="45" y="225" font-size="19">n=1，μ=2</text><text x="45" y="271" font-size="19">M₂=0</text><rect x="243.75" y="130" width="198.75" height="185" rx="12" fill="white" stroke="#b9d5d9"/><text x="258.75" y="173" font-size="21" font-weight="700">x=4</text><text x="258.75" y="225" font-size="19">n=2，μ=3</text><text x="258.75" y="271" font-size="19">M₂=2</text><rect x="457.5" y="130" width="198.75" height="185" rx="12" fill="white" stroke="#b9d5d9"/><text x="472.5" y="173" font-size="21" font-weight="700">x=4</text><text x="472.5" y="225" font-size="19">n=3，μ=10/3</text><text x="472.5" y="271" font-size="19">M₂=8/3</text><rect x="671.25" y="130" width="198.75" height="185" rx="12" fill="white" stroke="#b9d5d9"/><text x="686.25" y="173" font-size="21" font-weight="700">x=6</text><text x="686.25" y="225" font-size="19">n=4，μ=4</text><text x="686.25" y="271" font-size="19">M₂=8</text><text x="30" y="365" font-size="18">完整条件、单位、推导与边界见正文相应公式和手算表。</text></g></svg>
