<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title-85306 desc-85306"><title id="title-85306">两份效率结果先还原同一比较口径</title><desc id="desc-85306">只比最终绝对值会漏过程，只比归一化保持率又会遮住初始差异；测试条件应先对齐。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#845721"/></marker></defs><rect width="900" height="360" fill="#f8fafc"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#172b45"><text x="36" y="38" font-size="24" font-weight="700">两份效率结果先还原同一比较口径</text><text x="36" y="69" font-size="17" fill="#845721">并列对照：卡片宽度不表示数量、时长或比例</text><rect x="36" y="99" width="240" height="175" rx="12" fill="white" stroke="#845721" stroke-width="1.5"/><path d="M48 99 H264" stroke="#845721" stroke-width="4"/><text x="52" y="133" font-size="20" font-weight="700" fill="#845721">初始扫描结果</text><text x="52" y="198" font-size="18">说明有效面积与测量方式</text><rect x="330" y="99" width="240" height="175" rx="12" fill="white" stroke="#845721" stroke-width="1.5"/><path d="M342 99 H558" stroke="#845721" stroke-width="4"/><text x="346" y="133" font-size="20" font-weight="700" fill="#845721">持续工作输出</text><text x="346" y="198" font-size="18">记录环境工作状态与时间</text><rect x="624" y="99" width="240" height="175" rx="12" fill="white" stroke="#845721" stroke-width="1.5"/><path d="M636 99 H852" stroke="#845721" stroke-width="4"/><text x="640" y="133" font-size="20" font-weight="700" fill="#845721">比较稳定性</text><text x="640" y="198" font-size="18">同时保留起点与随时间的</text><text x="640" y="228" font-size="18">变化</text><text x="36" y="319" font-size="17">依据本文已有情境绘制 · 不表示生产测量或通用性能保证</text></g></svg>
