<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title-94673 desc-94673"><title id="title-94673">建站与连线进入同一费用图</title><desc id="desc-94673">统一成生成树同时处理费用与接入电源的连通性，避免逐城局部选择留下无源环。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#225a8c"/></marker></defs><rect width="900" height="360" fill="#f8fafc"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#172b45"><text x="36" y="38" font-size="24" font-weight="700">建站与连线进入同一费用图</text><text x="36" y="69" font-size="17" fill="#225a8c">并列对照：卡片宽度不表示数量、时长或比例</text><rect x="36" y="99" width="240" height="175" rx="12" fill="white" stroke="#225a8c" stroke-width="1.5"/><path d="M48 99 H264" stroke="#225a8c" stroke-width="4"/><text x="52" y="133" font-size="20" font-weight="700" fill="#225a8c">两城都建站</text><text x="52" y="198" font-size="18">费用3加3等于6</text><rect x="330" y="99" width="240" height="175" rx="12" fill="white" stroke="#225a8c" stroke-width="1.5"/><path d="M342 99 H558" stroke="#225a8c" stroke-width="4"/><text x="346" y="133" font-size="20" font-weight="700" fill="#225a8c">一站加连线</text><text x="346" y="198" font-size="18">费用3加2等于5</text><rect x="624" y="99" width="240" height="175" rx="12" fill="white" stroke="#225a8c" stroke-width="1.5"/><path d="M636 99 H852" stroke="#225a8c" stroke-width="4"/><text x="640" y="133" font-size="20" font-weight="700" fill="#225a8c">虚拟源点</text><text x="640" y="198" font-size="18">两条站边与城际边统一选</text><text x="640" y="228" font-size="18">取</text><text x="36" y="319" font-size="17">依据本文已有情境绘制 · 不表示生产测量或通用性能保证</text></g></svg>
