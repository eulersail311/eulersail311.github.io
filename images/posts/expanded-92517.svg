<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title-92517 desc-92517"><title id="title-92517">安静终点的复听路径</title><desc id="desc-92517">安静不自动等于未完成；应把收束过程与已经建立的材料关系一起比较。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#7c3e60"/></marker></defs><rect width="900" height="360" fill="#f8fafc"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#172b45"><text x="36" y="38" font-size="24" font-weight="700">安静终点的复听路径</text><text x="36" y="69" font-size="17" fill="#7c3e60">步骤关系：箭头表示本图的处理或观察顺序</text><rect x="36" y="99" width="240" height="175" rx="12" fill="white" stroke="#7c3e60" stroke-width="1.5"/><path d="M48 99 H264" stroke="#7c3e60" stroke-width="4"/><text x="52" y="133" font-size="20" font-weight="700" fill="#7c3e60">终乐章结尾</text><text x="52" y="198" font-size="18">记录运动怎样减少</text><path d="M283 185 H317" stroke="#7c3e60" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="99" width="240" height="175" rx="12" fill="white" stroke="#7c3e60" stroke-width="1.5"/><path d="M342 99 H558" stroke="#7c3e60" stroke-width="4"/><text x="346" y="133" font-size="20" font-weight="700" fill="#7c3e60">第一乐章开头</text><text x="346" y="198" font-size="18">寻找可核对的材料联系</text><path d="M577 185 H611" stroke="#7c3e60" stroke-width="2" marker-end="url(#arrow)"/><rect x="624" y="99" width="240" height="175" rx="12" fill="white" stroke="#7c3e60" stroke-width="1.5"/><path d="M636 99 H852" stroke="#7c3e60" stroke-width="4"/><text x="640" y="133" font-size="20" font-weight="700" fill="#7c3e60">两种结束感</text><text x="640" y="198" font-size="18">分开局部句尾与全曲终点</text><text x="36" y="319" font-size="17">聆听观察示意 · 不是谱例、波形或演出时间轴</text></g></svg>
