<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title-65279 desc-65279"><title id="title-65279">平滑的时间参照必须先固定</title><desc id="desc-65279">更对称或更平滑不是唯一目标；先确定在线决策还是离线展示，再讨论响应速度与噪声。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#176756"/></marker></defs><rect width="900" height="360" fill="#f8fafc"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#172b45"><text x="36" y="38" font-size="24" font-weight="700">平滑的时间参照必须先固定</text><text x="36" y="69" font-size="17" fill="#176756">并列对照：卡片宽度不表示数量、时长或比例</text><rect x="36" y="99" width="240" height="175" rx="12" fill="white" stroke="#176756" stroke-width="1.5"/><path d="M48 99 H264" stroke="#176756" stroke-width="4"/><text x="52" y="133" font-size="20" font-weight="700" fill="#176756">因果移动平均</text><text x="52" y="198" font-size="18">只用当前与过去，突变初</text><text x="52" y="228" font-size="18">期混入旧值</text><rect x="330" y="99" width="240" height="175" rx="12" fill="white" stroke="#176756" stroke-width="1.5"/><path d="M342 99 H558" stroke="#176756" stroke-width="4"/><text x="346" y="133" font-size="20" font-weight="700" fill="#176756">指数平滑</text><text x="346" y="198" font-size="18">历史保留方式改变但仍有</text><text x="346" y="228" font-size="18">记忆</text><rect x="624" y="99" width="240" height="175" rx="12" fill="white" stroke="#176756" stroke-width="1.5"/><path d="M636 99 H852" stroke="#176756" stroke-width="4"/><text x="640" y="133" font-size="20" font-weight="700" fill="#176756">中心窗口</text><text x="640" y="198" font-size="18">使用未来数据，不可直接</text><text x="640" y="228" font-size="18">当实时检测</text><text x="36" y="319" font-size="17">依据本文已有情境绘制 · 不表示生产测量或通用性能保证</text></g></svg>
