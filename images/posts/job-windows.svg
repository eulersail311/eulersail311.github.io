<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280"><title>定长窗口的贪心反例</title><rect width="900" height="280" fill="#f6f9fc"/><g font-family="Microsoft YaHei,sans-serif" fill="#234467"><text x="35" y="42" font-size="24">单个窗口最大，不等于整体最优</text><g font-size="25"><text x="150" y="95">5</text><text x="250" y="95">6</text><text x="350" y="95">6</text><text x="450" y="95">5</text><text x="550" y="95">0</text><text x="650" y="95">0</text></g><g fill="none" stroke-width="4"><path d="M235 115 H385" stroke="#a34b37"/><path d="M135 170 H285 M335 170 H485" stroke="#246544"/></g><g font-size="19"><text x="430" y="128">贪心：12 + 0 = 12</text><text x="520" y="183">最优：11 + 11 = 22</text><text x="35" y="245">位置为1起点；m=2、k=2；横线标出选中位置范围</text></g></g></svg>
