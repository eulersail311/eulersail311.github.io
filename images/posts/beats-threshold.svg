<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300"><title>严格次大值划分条件更新区域</title><rect width="900" height="300" fill="#f6f9fc"/><g font-family="Microsoft YaHei,sans-serif" fill="#25486a"><text x="35" y="42" font-size="24">[9,9,5,1]：最大值9，严格次大值5</text><g fill="#fff" stroke="#39749a"><rect x="35" y="78" width="260" height="150" rx="12"/><rect x="320" y="78" width="260" height="150" rx="12"/><rect x="605" y="78" width="260" height="150" rx="12"/></g><g font-size="22" font-weight="700"><text x="55" y="116">阈值至少为9</text><text x="340" y="116">阈值在5与9之间</text><text x="625" y="116">阈值不超过5</text></g><g font-size="18"><text x="55" y="164">全部不变，直接返回</text><text x="340" y="164">完整覆盖时只改最大组</text><text x="625" y="164">需要下降，重新合并</text><text x="35" y="270">原创条件分类图 · 区域等宽不表示数值比例</text></g></g></svg>
