<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="HTTP字节范围：位置从0开始，两端都包含"><rect width="900" height="400" rx="16" fill="#f8fafc"/><g font-family="'Microsoft YaHei',sans-serif" fill="#183044"><text x="36" y="42" font-size="24" font-weight="700">HTTP字节范围：位置从0开始，两端都包含</text><text x="36" y="72" font-size="16">教学表示：ABCDEFGHIJ；N = 10字节；无内容编码</text><rect x="50" y="140" width="68" height="70" rx="8" fill="#e2e8f0" stroke="#54758a"/><text x="84" y="125" text-anchor="middle" font-size="18">0</text><text x="84" y="184" text-anchor="middle" font-size="25">A</text><rect x="130" y="140" width="68" height="70" rx="8" fill="#e2e8f0" stroke="#54758a"/><text x="164" y="125" text-anchor="middle" font-size="18">1</text><text x="164" y="184" text-anchor="middle" font-size="25">B</text><rect x="210" y="140" width="68" height="70" rx="8" fill="#c5e9fa" stroke="#54758a"/><text x="244" y="125" text-anchor="middle" font-size="18">2</text><text x="244" y="184" text-anchor="middle" font-size="25">C</text><rect x="290" y="140" width="68" height="70" rx="8" fill="#c5e9fa" stroke="#54758a"/><text x="324" y="125" text-anchor="middle" font-size="18">3</text><text x="324" y="184" text-anchor="middle" font-size="25">D</text><rect x="370" y="140" width="68" height="70" rx="8" fill="#c5e9fa" stroke="#54758a"/><text x="404" y="125" text-anchor="middle" font-size="18">4</text><text x="404" y="184" text-anchor="middle" font-size="25">E</text><rect x="450" y="140" width="68" height="70" rx="8" fill="#c5e9fa" stroke="#54758a"/><text x="484" y="125" text-anchor="middle" font-size="18">5</text><text x="484" y="184" text-anchor="middle" font-size="25">F</text><rect x="530" y="140" width="68" height="70" rx="8" fill="#e2e8f0" stroke="#54758a"/><text x="564" y="125" text-anchor="middle" font-size="18">6</text><text x="564" y="184" text-anchor="middle" font-size="25">G</text><rect x="610" y="140" width="68" height="70" rx="8" fill="#e2e8f0" stroke="#54758a"/><text x="644" y="125" text-anchor="middle" font-size="18">7</text><text x="644" y="184" text-anchor="middle" font-size="25">H</text><rect x="690" y="140" width="68" height="70" rx="8" fill="#e2e8f0" stroke="#54758a"/><text x="724" y="125" text-anchor="middle" font-size="18">8</text><text x="724" y="184" text-anchor="middle" font-size="25">I</text><rect x="770" y="140" width="68" height="70" rx="8" fill="#e2e8f0" stroke="#54758a"/><text x="804" y="125" text-anchor="middle" font-size="18">9</text><text x="804" y="184" text-anchor="middle" font-size="25">J</text><rect x="200" y="240" width="490" height="43" rx="8" fill="#d9eef8"/><text x="222" y="268" font-size="18">bytes=2-5 → CDEF → 5 − 2 + 1 = 4字节</text><text x="50" y="324" font-size="18">已有前四字节ABCD：保存偏移0—3，下一偏移是4。</text><text x="50" y="365" font-size="16">字节格不是字符格，也不是传输时间刻度。</text></g></svg>
