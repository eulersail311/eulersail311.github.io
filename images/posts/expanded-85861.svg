<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title-85861 desc-85861"><title id="title-85861">只改总热容与整体放大不是同一操作</title><desc id="desc-85861">质量变化能否只缩放时间，需要同时检查几何、边界换热和内部近等温条件。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#845721"/></marker></defs><rect width="900" height="360" fill="#f8fafc"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#172b45"><text x="36" y="38" font-size="24" font-weight="700">只改总热容与整体放大不是同一操作</text><text x="36" y="69" font-size="17" fill="#845721">并列对照：卡片宽度不表示数量、时长或比例</text><rect x="36" y="99" width="240" height="175" rx="12" fill="white" stroke="#845721" stroke-width="1.5"/><path d="M48 99 H264" stroke="#845721" stroke-width="4"/><text x="52" y="133" font-size="20" font-weight="700" fill="#845721">只把总热容加倍</text><text x="52" y="198" font-size="18">保持h与换热面积不变</text><rect x="330" y="99" width="240" height="175" rx="12" fill="white" stroke="#845721" stroke-width="1.5"/><path d="M342 99 H558" stroke="#845721" stroke-width="4"/><text x="346" y="133" font-size="20" font-weight="700" fill="#845721">集总模型的结果</text><text x="346" y="198" font-size="18">时间常数和同温差比时间</text><text x="346" y="228" font-size="18">加倍</text><rect x="624" y="99" width="240" height="175" rx="12" fill="white" stroke="#845721" stroke-width="1.5"/><path d="M636 99 H852" stroke="#845721" stroke-width="4"/><text x="640" y="133" font-size="20" font-weight="700" fill="#845721">整体几何放大</text><text x="640" y="198" font-size="18">面积和导热距离也随之变</text><text x="640" y="228" font-size="18">化</text><text x="36" y="319" font-size="17">依据本文已有情境绘制 · 不表示生产测量或通用性能保证</text></g></svg>
