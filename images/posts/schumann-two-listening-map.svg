<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">舒曼第二交响曲的四个聆听任务</title><desc id="desc">第一乐章分层听铜管和弦乐，第二乐章跟住短音运动，第三乐章等待长句的落点，第四乐章比较回忆与新的歌唱主题。</desc><rect width="900" height="520" rx="20" fill="#f8f5f0"/><g font-family="Microsoft YaHei, sans-serif" fill="#453629"><text x="40" y="50" font-size="27" font-weight="700">从开篇尺度，到新的结束参照</text><g stroke="#9d7954" stroke-width="2"><rect x="40" y="89" width="390" height="151" rx="16" fill="#f1e4d3"/><rect x="470" y="89" width="390" height="151" rx="16" fill="#ece9db"/><rect x="40" y="275" width="390" height="151" rx="16" fill="#e7edf0"/><rect x="470" y="275" width="390" height="151" rx="16" fill="#eee0df"/></g><text x="62" y="127" font-size="23" font-weight="700">I · 听见两层时间</text><text x="62" y="170" font-size="21">铜管轮廓 / 弦乐流动</text><text x="62" y="211" font-size="18">进入快板后，比较密度与句尾</text><text x="492" y="127" font-size="23" font-weight="700">II · 运动需要换气</text><text x="492" y="170" font-size="21">短音活动 / 中间段变化</text><text x="492" y="211" font-size="18">返回时，认出旋律还是步态？</text><text x="62" y="313" font-size="23" font-weight="700">III · 等待长句落点</text><text x="62" y="356" font-size="21">旋律延伸 / 声部回应</text><text x="62" y="397" font-size="18">用预测句尾，检查听觉期待</text><text x="492" y="313" font-size="23" font-weight="700">IV · 新主题成为参照</text><text x="492" y="356" font-size="21">回忆材料 / 后出的歌唱</text><text x="492" y="397" font-size="18">比较入场与终场，不只听音量</text><text x="40" y="469" font-size="19">记录对象：音色、织体、句长、返回与转折</text><text x="40" y="502" font-size="15">Original listening tasks · Not a score, waveform or measured timeline</text></g></svg>
