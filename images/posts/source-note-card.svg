<g font-size="18"><text x="631" y="198">① 谁报告、哪一版</text><text x="631" y="240">② 原文的具体位置</text><text x="631" y="282">③ 我计算或改写了什么</text><text x="631" y="324">④ 这条证据支持到哪里</text><text x="631" y="366">⑤ 还有什么没有核读</text></g>
<text x="40" y="472" font-size="17">网址负责定位；版本、位置和条件帮助你恢复当时的阅读现场。</text></g></svg>
