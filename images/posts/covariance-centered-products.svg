<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-label="相对同一个中心，核对四个乘积"><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:19px;fill:#183b48}.title{font-size:26px;font-weight:700}.bold{font-weight:700}.small{font-size:17px}.box{fill:#edf7f5;stroke:#8bbeb3;stroke-width:2}</style><rect width="900" height="460" rx="16" fill="#fbfdfc"/><text class="title" x="32" y="44">相对同一个中心，核对四个乘积</text><rect x="80" y="60" width="360" height="320" fill="white" stroke="#94b8b5"/><path d="M260 60V380 M80 220H440" stroke="#739a98" stroke-dasharray="6 5"/><text class="small" x="274" y="88">中心 (2.5, 2.5)</text><text x="455" y="386">x</text><text x="54" y="72">y</text><text class="small" x="144" y="407">1</text><text class="small" x="51" y="322">1</text><text class="small" x="216" y="407">2</text><text class="small" x="51" y="258">2</text><text class="small" x="288" y="407">3</text><text class="small" x="51" y="194">3</text><text class="small" x="360" y="407">4</text><text class="small" x="51" y="130">4</text><circle cx="152" cy="252" r="8" fill="#087e75"/><text class="small" x="164" y="244">(1, 2)</text><circle cx="224" cy="316" r="8" fill="#087e75"/><text class="small" x="236" y="308">(2, 1)</text><circle cx="296" cy="124" r="8" fill="#087e75"/><text class="small" x="308" y="116">(3, 4)</text><circle cx="368" cy="188" r="8" fill="#087e75"/><text class="small" x="380" y="180">(4, 3)</text><rect class="box" x="520" y="92" width="345" height="286" rx="12"/><text class="bold" x="544" y="128">四个中心积贡献</text><text x="544" y="173">(−1.5) × (−0.5) = 0.75</text><text x="544" y="215">(−0.5) × (−1.5) = 0.75</text><text x="544" y="257">  0.5  ×  1.5    = 0.75</text><text x="544" y="299">  1.5  ×  0.5    = 0.75</text><text class="bold" x="544" y="349">C = 3；Sxx = Syy = 5</text><text class="small" x="80" y="440">贡献相对最终均值计算，与逐次更新的增量不同。</text></svg>
