<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title-85972 desc-85972"><title id="title-85972">净辐射为零，不是双向交换消失</title><desc id="desc-85972">温度接近时尤其不能把总发射量直接当散热量；应先保留吸收项，再讨论局部线性化。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#845721"/></marker></defs><rect width="900" height="360" fill="#f8fafc"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#172b45"><text x="36" y="38" font-size="24" font-weight="700">净辐射为零，不是双向交换消失</text><text x="36" y="69" font-size="17" fill="#845721">并列对照：卡片宽度不表示数量、时长或比例</text><rect x="36" y="99" width="240" height="175" rx="12" fill="white" stroke="#845721" stroke-width="1.5"/><path d="M48 99 H264" stroke="#845721" stroke-width="4"/><text x="52" y="133" font-size="20" font-weight="700" fill="#845721">物体发射</text><text x="52" y="198" font-size="18">同温下仍向外发出辐射</text><rect x="330" y="99" width="240" height="175" rx="12" fill="white" stroke="#845721" stroke-width="1.5"/><path d="M342 99 H558" stroke="#845721" stroke-width="4"/><text x="346" y="133" font-size="20" font-weight="700" fill="#845721">环境提供</text><text x="346" y="198" font-size="18">仍有辐射被物体吸收</text><rect x="624" y="99" width="240" height="175" rx="12" fill="white" stroke="#845721" stroke-width="1.5"/><path d="M636 99 H852" stroke="#845721" stroke-width="4"/><text x="640" y="133" font-size="20" font-weight="700" fill="#845721">两项相等</text><text x="640" y="198" font-size="18">净热流为0</text><text x="36" y="319" font-size="17">依据本文已有情境绘制 · 不表示生产测量或通用性能保证</text></g></svg>
