<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-label="短窗口保留跨边界请求的裁剪贡献"><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:19px;fill:#243c4a}.title{font-size:26px;font-weight:700}.bold{font-weight:700}.small{font-size:17px}.card{fill:#edf5f3;stroke:#9dbeb5;stroke-width:2}.axis{stroke:#a6b8bf;stroke-width:1}</style><rect width="900" height="460" rx="16" fill="#fbfdfc"/><text class="title" x="30" y="45">窗口[2,5]：未完成，也要计入在途面积</text><text class="small" x="300" y="85">观察窗口：3秒</text><rect x="300" y="100" width="240" height="255" fill="#e3f0e8"/><path d="M300 95V360M540 95V360" stroke="#bf6d38" stroke-width="2" stroke-dasharray="6 5"/><g data-job="B" data-overlap="3"><text class="bold" x="45" y="156">B</text><rect x="220" y="135" width="320" height="28" fill="#dce3e6"/><rect x="300" y="135" width="240" height="28" fill="#267e76"/><text class="small" x="800" y="156">3请求·s</text></g><g data-job="C" data-overlap="2"><text class="bold" x="45" y="226">C</text><rect x="380" y="205" width="240" height="28" fill="#dce3e6"/><rect x="380" y="205" width="160" height="28" fill="#267e76"/><text class="small" x="800" y="226">2请求·s</text></g><g data-job="D" data-overlap="1"><text class="bold" x="45" y="296">D</text><rect x="460" y="275" width="320" height="28" fill="#dce3e6"/><rect x="460" y="275" width="80" height="28" fill="#267e76"/><text class="small" x="800" y="296">1请求·s</text></g><line class="axis" x1="140" x2="140" y1="361" y2="368"/><text class="small" text-anchor="middle" x="140" y="390">0</text><line class="axis" x1="220" x2="220" y1="361" y2="368"/><text class="small" text-anchor="middle" x="220" y="390">1</text><line class="axis" x1="300" x2="300" y1="361" y2="368"/><text class="small" text-anchor="middle" x="300" y="390">2</text><line class="axis" x1="380" x2="380" y1="361" y2="368"/><text class="small" text-anchor="middle" x="380" y="390">3</text><line class="axis" x1="460" x2="460" y1="361" y2="368"/><text class="small" text-anchor="middle" x="460" y="390">4</text><line class="axis" x1="540" x2="540" y1="361" y2="368"/><text class="small" text-anchor="middle" x="540" y="390">5</text><line class="axis" x1="620" x2="620" y1="361" y2="368"/><text class="small" text-anchor="middle" x="620" y="390">6</text><line class="axis" x1="700" x2="700" y1="361" y2="368"/><text class="small" text-anchor="middle" x="700" y="390">7</text><line class="axis" x1="780" x2="780" y1="361" y2="368"/><text class="small" text-anchor="middle" x="780" y="390">8</text><text class="bold" x="30" y="435">窗口面积：3 + 2 + 1 = 6请求·s；平均在途：6/3 = 2请求</text></svg>
