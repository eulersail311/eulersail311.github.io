<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title-65742 desc-65742"><title id="title-65742">一次逻辑请求只共享一个时间账本</title><desc id="desc-65742">时间尚足不等于重放安全；响应丢失时，服务端是否已执行仍要由操作语义和去重契约判断。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#5a4087"/></marker></defs><rect width="900" height="360" fill="#f8fafc"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#172b45"><text x="36" y="38" font-size="24" font-weight="700">一次逻辑请求只共享一个时间账本</text><text x="36" y="69" font-size="17" fill="#5a4087">步骤关系：箭头表示本图的处理或观察顺序</text><rect x="36" y="99" width="240" height="175" rx="12" fill="white" stroke="#5a4087" stroke-width="1.5"/><path d="M48 99 H264" stroke="#5a4087" stroke-width="4"/><text x="52" y="133" font-size="20" font-weight="700" fill="#5a4087">总预算900毫秒</text><text x="52" y="198" font-size="18">首次尝试消耗180毫秒</text><path d="M283 185 H317" stroke="#5a4087" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="99" width="240" height="175" rx="12" fill="white" stroke="#5a4087" stroke-width="1.5"/><path d="M342 99 H558" stroke="#5a4087" stroke-width="4"/><text x="346" y="133" font-size="20" font-weight="700" fill="#5a4087">退避70再尝试350</text><text x="346" y="198" font-size="18">累计已用600毫秒</text><path d="M577 185 H611" stroke="#5a4087" stroke-width="2" marker-end="url(#arrow)"/><rect x="624" y="99" width="240" height="175" rx="12" fill="white" stroke="#5a4087" stroke-width="1.5"/><path d="M636 99 H852" stroke="#5a4087" stroke-width="4"/><text x="640" y="133" font-size="20" font-weight="700" fill="#5a4087">剩余预算300</text><text x="640" y="198" font-size="18">不能重新得到完整单次窗</text><text x="640" y="228" font-size="18">口</text><text x="36" y="319" font-size="17">依据本文已有情境绘制 · 不表示生产测量或通用性能保证</text></g></svg>
