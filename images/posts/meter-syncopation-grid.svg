<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">切分：弱位起音跨过强拍</title><desc id="desc">等距八分细分中，音在前小节四拍的后半起音，持续越过下一小节第一拍，第一拍没有重新起音。不是所有切分的定义或唯一形式。</desc><rect width="900" height="440" rx="20" fill="#faf5ee"/><g font-family="Microsoft YaHei, sans-serif" fill="#49344b"><text x="40" y="52" font-size="27" font-weight="bold">脉搏照常走，声音跨过落脚处</text><text x="40" y="90" font-size="19">自拟 4/4 的跨小节切分例子 · 横轴为等长八分细分</text><rect x="435" y="115" width="70" height="225" fill="#f0dec2"/><path d="M100 185 H800" stroke="#9d8ca8" stroke-width="2"/><g stroke="#9d8ca8" stroke-width="2"><path d="M120 165 V205 M295 165 V205 M470 145 V225 M645 165 V205 M820 165 V205"/></g><g text-anchor="middle" font-size="22"><text x="120" y="145">4</text><text x="295" y="145">and</text><text x="470" y="145">1</text><text x="645" y="145">and</text><text x="820" y="145">2</text></g><path d="M295 270 H645" stroke="#845c99" stroke-width="18" stroke-linecap="round"/><circle cx="295" cy="270" r="17" fill="#49344b"/><g font-size="20"><text x="62" y="277">发声</text><text x="225" y="322">弱位起音</text><text x="410" y="366">强拍不重新起音</text><text x="62" y="407" font-size="18">黑点表示起音，线段表示持续；这是切分的一种情况，不以音量大小定义强拍。</text></g><path d="M470 234 V294" stroke="#bd8d40" stroke-width="2" stroke-dasharray="5 5"/></g></svg>
