<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-label="火鸟组曲的听觉任务路线"><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:19px;fill:#263c4a}.title{font-size:26px;font-weight:700}.bold{font-weight:700}.small{font-size:17px}.card{fill:#edf5f3;stroke:#9dbeb5;stroke-width:2}</style><rect width="900" height="440" rx="16" fill="#fbfdfc"/><text class="title" x="30" y="42">火鸟1919：用相邻区域定位变化</text><rect class="card" x="20" y="105" width="160" height="225" rx="12"/><text class="bold" text-anchor="middle" x="100" y="155">引子与火鸟</text><text class="small" text-anchor="middle" x="100" y="235">背景与闪烁</text><path d="M182 275h11l-4 -4m4 4l-4 4" fill="none" stroke="#287d77" stroke-width="2"/><rect class="card" x="195" y="105" width="160" height="225" rx="12"/><text class="bold" text-anchor="middle" x="275" y="155">公主轮舞</text><text class="small" text-anchor="middle" x="275" y="235">歌唱与支撑</text><path d="M357 275h11l-4 -4m4 4l-4 4" fill="none" stroke="#287d77" stroke-width="2"/><rect class="card" x="370" y="105" width="160" height="225" rx="12"/><text class="bold" text-anchor="middle" x="450" y="155">地狱之舞</text><text class="small" text-anchor="middle" x="450" y="235">重音与推进</text><path d="M532 275h11l-4 -4m4 4l-4 4" fill="none" stroke="#287d77" stroke-width="2"/><rect class="card" x="545" y="105" width="160" height="225" rx="12"/><text class="bold" text-anchor="middle" x="625" y="155">摇篮曲</text><text class="small" text-anchor="middle" x="625" y="235">线条与呼吸</text><path d="M707 275h11l-4 -4m4 4l-4 4" fill="none" stroke="#287d77" stroke-width="2"/><rect class="card" x="720" y="105" width="160" height="225" rx="12"/><text class="bold" text-anchor="middle" x="800" y="155">终曲</text><text class="small" text-anchor="middle" x="800" y="235">局部到整体</text><text class="small" x="30" y="385">相邻片段按听觉任务合并；框宽不表示时长、速度或响度。</text></svg>
