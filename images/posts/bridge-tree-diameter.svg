<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc"><title id="title">从两个环到桥树直径</title><desc id="desc">两个三角形由桥相连，右侧再接两个单点。删桥后压缩成四个顶点的链，直径为三条边。</desc><rect width="900" height="500" rx="20" fill="#f4f7fb"/><g font-family="Microsoft YaHei, sans-serif" fill="#19344c"><text x="40" y="48" font-size="25" font-weight="700">环内可以绕路，桥不能绕开</text><g fill="none" stroke="#427693" stroke-width="3"><path d="M110 150 L210 150 L160 235 Z"/><path d="M380 150 L480 150 L430 235 Z"/></g><g stroke="#b64739" stroke-width="5"><path d="M210 150 H380"/><path d="M480 150 H630"/><path d="M630 150 H780"/></g><g fill="#fff" stroke="#427693" stroke-width="2"><circle cx="110" cy="150" r="20"/><circle cx="210" cy="150" r="20"/><circle cx="160" cy="235" r="20"/><circle cx="380" cy="150" r="20"/><circle cx="480" cy="150" r="20"/><circle cx="430" cy="235" r="20"/><circle cx="630" cy="150" r="20"/><circle cx="780" cy="150" r="20"/></g><g font-size="20" text-anchor="middle"><text x="110" y="157">1</text><text x="210" y="157">3</text><text x="160" y="242">2</text><text x="380" y="157">4</text><text x="480" y="157">5</text><text x="430" y="242">6</text><text x="630" y="157">7</text><text x="780" y="157">8</text></g><text x="40" y="295" font-size="20">删桥分块：A={1,2,3}　B={4,5,6}　C={7}　D={8}</text><path d="M160 370 H780" stroke="#b64739" stroke-width="5"/><g fill="#e0eff2" stroke="#427693" stroke-width="2"><circle cx="160" cy="370" r="27"/><circle cx="380" cy="370" r="27"/><circle cx="630" cy="370" r="27"/><circle cx="780" cy="370" r="27"/></g><g font-size="22" text-anchor="middle"><text x="160" y="378">A</text><text x="380" y="378">B</text><text x="630" y="378">C</text><text x="780" y="378">D</text></g><text x="40" y="440" font-size="22" font-weight="700">桥树直径 = 3 条边 = 最大同时必经的桥数</text><text x="40" y="477" font-size="16">原创教学图 · 距离按边计数 · 不按长度比例表示路径代价</text></g></svg>
