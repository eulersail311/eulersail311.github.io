<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title-82541 desc-82541"><title id="title-82541">先保留森林，再连接分量</title><desc id="desc-82541">并查集给出冗余边名额，输出还须指向确实存在的旧边，不能只证明最终边数正确。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#225a8c"/></marker></defs><rect width="900" height="360" fill="#f8fafc"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#172b45"><text x="36" y="38" font-size="24" font-weight="700">先保留森林，再连接分量</text><text x="36" y="69" font-size="17" fill="#225a8c">步骤关系：箭头表示本图的处理或观察顺序</text><rect x="36" y="99" width="240" height="175" rx="12" fill="white" stroke="#225a8c" stroke-width="1.5"/><path d="M48 99 H264" stroke="#225a8c" stroke-width="4"/><text x="52" y="133" font-size="20" font-weight="700" fill="#225a8c">三角形加孤立点</text><text x="52" y="198" font-size="18">四点三边仍不连通</text><path d="M283 185 H317" stroke="#225a8c" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="99" width="240" height="175" rx="12" fill="white" stroke="#225a8c" stroke-width="1.5"/><path d="M342 99 H558" stroke="#225a8c" stroke-width="4"/><text x="346" y="133" font-size="20" font-weight="700" fill="#225a8c">取一条环边替换</text><text x="346" y="198" font-size="18">原三角形内部继续可达</text><path d="M577 185 H611" stroke="#225a8c" stroke-width="2" marker-end="url(#arrow)"/><rect x="624" y="99" width="240" height="175" rx="12" fill="white" stroke="#225a8c" stroke-width="1.5"/><path d="M636 99 H852" stroke="#225a8c" stroke-width="4"/><text x="640" y="133" font-size="20" font-weight="700" fill="#225a8c">连到孤立点</text><text x="640" y="198" font-size="18">一次操作得到连通树</text><text x="36" y="319" font-size="17">依据本文已有情境绘制 · 不表示生产测量或通用性能保证</text></g></svg>
