<svg xmlns="http://www.w3.org/2000/svg" width="600" height="370" viewBox="0 0 600 370" role="img" aria-labelledby="title desc">
<title id="title">产生载流子之后，还要走到电极</title><desc id="desc">吸光层、界面接触、电极与外电路由蓝线连接；体相与界面各有橙色复合损失分支。</desc>
<defs><marker id="blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#176b94"/></marker><marker id="orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#a84b1b"/></marker></defs>
<style>text{font:24px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#203c50;text-anchor:middle}.small{font-size:21px}.node rect,.cell{fill:#fff;stroke:#9ab6c8;stroke-width:2;rx:10}.selected,.node .selected,.range{fill:#d6edf6;stroke:#176b94;stroke-width:2}.group{fill:#eaf3f8;stroke:#b1cad9;stroke-width:2}.tree,.bracket{fill:none;stroke:#7898ad;stroke-width:2}.blue-line{fill:none;stroke:#176b94;stroke-width:3;marker-end:url(#blue)}.orange-line{fill:none;stroke:#a84b1b;stroke-width:3;marker-end:url(#orange)}.band{fill:none;stroke:#176b94;stroke-width:6;stroke-linecap:round}</style>
<rect width="600" height="370" rx="16" fill="#f6f9fc"/>
<text x="300" y="44">入射光 ↓</text><g class="node"><rect x="25" y="93" width="160" height="92"/><rect x="220" y="93" width="160" height="92"/><rect x="415" y="93" width="160" height="92"/></g><text x="105" y="131">吸光层</text><text x="105" y="165">产生载流子</text><text x="300" y="131">界面与接触</text><text x="300" y="165">选择性收集</text><text x="495" y="131">电极</text><text x="495" y="165">外电路输出</text><path class="blue-line" d="M185 139H218M380 139H413"/><path class="orange-line" d="M105 190V258M300 190V258"/><text x="105" y="303">体相损失</text><text x="300" y="303">界面损失</text><text class="small" x="495" y="287">功能示意</text><text class="small" x="495" y="318">非层厚剖面</text>
