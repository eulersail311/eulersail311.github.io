<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-label="切边与留边的合法情形"><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:19px;fill:#263c4a}.title{font-size:26px;font-weight:700}.bold{font-weight:700}.small{font-size:17px}.card{fill:#edf5f3;stroke:#9dbeb5;stroke-width:2}</style><rect width="900" height="440" rx="16" fill="#fbfdfc"/><text class="title" x="30" y="42">每条子边：先分操作，再检查开放块</text><rect class="card" x="35" y="90" width="400" height="245" rx="12"/><rect class="card" x="465" y="90" width="400" height="245" rx="12"/><text class="bold" x="55" y="135">保留连接边：两个开放块合并</text><text x="55" y="190">父0 + 子0 → 新0</text><text class="small" x="55" y="240">父0 + 子1、父1 + 子0 → 新1</text><text x="55" y="295">父1 + 子1：两个黑点，禁止</text><text class="bold" x="485" y="135">切断连接边：孩子立即封闭</text><text x="485" y="190">孩子必须恰有1个黑点</text><text x="485" y="240">父0 | 子1 → 新0</text><text x="485" y="295">父1 | 子1 → 新1</text><text class="small" x="30" y="397">其余已封闭块均须合法；暂时没有黑点的块，只能保持开放。</text></svg>
