<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title-72684 desc-72684"><title id="title-72684">共同平移给BatchNorm梯度一个检查方向</title><desc id="desc-72684">保留epsilon也不破坏共同平移关系；这项检查可发现遗漏均值路径或逐样本独立缩放的错误。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#5a4087"/></marker></defs><rect width="900" height="360" fill="#f8fafc"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#172b45"><text x="36" y="38" font-size="24" font-weight="700">共同平移给BatchNorm梯度一个检查方向</text><text x="36" y="69" font-size="17" fill="#5a4087">步骤关系：箭头表示本图的处理或观察顺序</text><rect x="36" y="99" width="240" height="175" rx="12" fill="white" stroke="#5a4087" stroke-width="1.5"/><path d="M48 99 H264" stroke="#5a4087" stroke-width="4"/><text x="52" y="133" font-size="20" font-weight="700" fill="#5a4087">整批输入共同加常数</text><text x="52" y="198" font-size="18">均值随之增加相同常数</text><path d="M283 185 H317" stroke="#5a4087" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="99" width="240" height="175" rx="12" fill="white" stroke="#5a4087" stroke-width="1.5"/><path d="M342 99 H558" stroke="#5a4087" stroke-width="4"/><text x="346" y="133" font-size="20" font-weight="700" fill="#5a4087">中心化结果</text><text x="346" y="198" font-size="18">差值与方差不改变</text><path d="M577 185 H611" stroke="#5a4087" stroke-width="2" marker-end="url(#arrow)"/><rect x="624" y="99" width="240" height="175" rx="12" fill="white" stroke="#5a4087" stroke-width="1.5"/><path d="M636 99 H852" stroke="#5a4087" stroke-width="4"/><text x="640" y="133" font-size="20" font-weight="700" fill="#5a4087">沿此方向求导</text><text x="640" y="198" font-size="18">输入梯度之和应接近0</text><text x="36" y="319" font-size="17">依据本文已有情境绘制 · 不表示生产测量或通用性能保证</text></g></svg>
