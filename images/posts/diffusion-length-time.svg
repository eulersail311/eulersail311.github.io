  <g font-family="system-ui, sans-serif" fill="#213b43">
    <text x="45" y="48" font-size="26" font-weight="700">变长的距离，需要平方增长的时间</text>
    <text x="45" y="80" font-size="17" fill="#50646b">固定浓度边界 · 相似的第一正弦模态 · D = 10⁻¹² m²/s</text>
    <text x="49" y="119" font-size="16">a(t)/A</text>
