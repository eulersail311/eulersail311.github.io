<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">长度加倍，正弦模态衰减时间四倍</title>
  <desc id="desc">固定两端浓度，D相同。100与200微米薄层的归一化正弦模态幅度按解析公式指数下降，半幅时间为702.30和2809.22秒。</desc>
