    <text x="660" y="323" font-size="17">τ ≈ 4052.85 s</text>
    <text x="660" y="349" font-size="17">半幅 ≈ 2809.22 s</text>
    <rect x="45" y="428" width="810" height="48" rx="12" fill="#e5efeb"/>
    <text x="66" y="458" font-size="18" font-weight="600">a(t)/A = exp(−Dπ²t/L²)；半幅折半的是过量浓度，非总浓度。</text>
    <text x="45" y="502" font-size="14" fill="#50646b">原创解析合成图；同一无量纲问题中长度加倍，τ 与半幅时间均为四倍。</text>
  </g>
