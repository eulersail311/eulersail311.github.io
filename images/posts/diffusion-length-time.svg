    <rect x="642" y="137" width="213" height="105" rx="13" fill="#e2f0ef"/>
    <text x="660" y="168" font-size="20" font-weight="700" fill="#167e91">L = 100 μm</text>
    <text x="660" y="199" font-size="17">τ ≈ 1013.21 s</text>
    <text x="660" y="225" font-size="17">半幅 ≈ 702.30 s</text>
    <rect x="642" y="261" width="213" height="105" rx="13" fill="#f4eadd"/>
