<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-label="工作区的当前状态独立，仓库对象共享"><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:19px;fill:#183b48}.title{font-size:26px;font-weight:700}.bold{font-weight:700}.small{font-size:17px}.box{fill:#edf7f5;stroke:#8bbeb3;stroke-width:2}</style><rect width="900" height="460" rx="16" fill="#fbfdfc"/><text class="title" x="32" y="44">工作区的当前状态独立，仓库对象共享</text><rect class="box" x="35" y="85" width="250" height="212" rx="12"/><text class="bold" x="55" y="125">main</text><text x="55" y="172">HEAD → main</text><text x="55" y="218">文件：A + B + C</text><text x="55" y="264">索引：A + B</text><path d="M160 297V332" stroke="#267d70" stroke-width="3"/><rect class="box" x="325" y="85" width="250" height="212" rx="12"/><text class="bold" x="345" y="125">topic</text><text x="345" y="172">HEAD → topic</text><text x="345" y="218">文件：A + D</text><text x="345" y="264">索引：A + D</text><path d="M450 297V332" stroke="#267d70" stroke-width="3"/><rect class="box" x="615" y="85" width="250" height="212" rx="12"/><text class="bold" x="635" y="125">review</text><text x="635" y="172">HEAD → 提交 D</text><text x="635" y="218">文件：A + D</text><text x="635" y="264">索引：A + D</text><path d="M740 297V332" stroke="#267d70" stroke-width="3"/><rect x="35" y="332" width="830" height="86" rx="12" fill="#d9eee8"/><text class="bold" x="70" y="368">公共区：提交 / 树 / blob 对象，普通分支引用</text><text class="small" x="70" y="401">配置默认也共享；不同目录不提供进程、端口或外部服务隔离。</text></svg>
