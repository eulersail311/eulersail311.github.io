<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="title desc"><title id="title">主题身份与声音性格分开记录</title><desc id="desc">横向比较节奏、轮廓、句尾；纵向比较速度、和声、配器。不是具体作品谱例。</desc><rect width="900" height="380" rx="20" fill="#faf5ee"/><g font-family="Microsoft YaHei, sans-serif" fill="#49344b"><text x="40" y="52" font-size="27" font-weight="bold">熟悉感从哪里来？把两个问题分开</text><rect x="40" y="93" width="395" height="200" rx="14" fill="#eee6f4"/><rect x="465" y="93" width="395" height="200" rx="14" fill="#e1eee7"/><text x="65" y="137" font-size="24">身份线索</text><text x="490" y="137" font-size="24">性格变化</text><g font-size="21"><text x="65" y="184">节奏型 · 旋律轮廓 · 句尾</text><text x="490" y="184">速度 · 和声 · 配器 · 音区</text><text x="65" y="234">哪些关系仍可辨认？</text><text x="490" y="234">同一材料承担了什么新作用？</text></g><text x="45" y="338" font-size="19">原创记录框架，不是谱例或相似度测量；听不确定的地方可以留空。</text></g></svg>
