<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title-79428 desc-79428"><title id="title-79428">背包候选：合理不等于最优</title><desc id="desc-79428">这份小例子用于核对可行性与最优性的区别；随机搜索进展也应与评估预算一起报告。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#225a8c"/></marker></defs><rect width="900" height="360" fill="#f8fafc"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#172b45"><text x="36" y="38" font-size="24" font-weight="700">背包候选：合理不等于最优</text><text x="36" y="69" font-size="17" fill="#225a8c">并列对照：卡片宽度不表示数量、时长或比例</text><rect x="36" y="99" width="240" height="175" rx="12" fill="white" stroke="#225a8c" stroke-width="1.5"/><path d="M48 99 H264" stroke="#225a8c" stroke-width="4"/><text x="52" y="133" font-size="20" font-weight="700" fill="#225a8c">容量为3</text><text x="52" y="198" font-size="18">物品重2值3与重3值4</text><rect x="330" y="99" width="240" height="175" rx="12" fill="white" stroke="#225a8c" stroke-width="1.5"/><path d="M342 99 H558" stroke="#225a8c" stroke-width="4"/><text x="346" y="133" font-size="20" font-weight="700" fill="#225a8c">单位收益优先</text><text x="346" y="198" font-size="18">选择重2的物品只得3</text><rect x="624" y="99" width="240" height="175" rx="12" fill="white" stroke="#225a8c" stroke-width="1.5"/><path d="M636 99 H852" stroke="#225a8c" stroke-width="4"/><text x="640" y="133" font-size="20" font-weight="700" fill="#225a8c">精确参照</text><text x="640" y="198" font-size="18">选择重3的物品可得4</text><text x="36" y="319" font-size="17">依据本文已有情境绘制 · 不表示生产测量或通用性能保证</text></g></svg>
