<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320"><title>把结论读成可检查的推理</title><rect width="900" height="320" fill="#f5f8fb" rx="16"/><g font-family="Microsoft YaHei,sans-serif" fill="#243b55"><text x="35" y="55" font-size="28" font-weight="700">把结论读成可检查的推理</text><rect x="25" y="100" width="205" height="140" rx="12" fill="white" stroke="#b8cce0"/><text x="40" y="145" font-size="22" font-weight="700">原步骤</text><text x="40" y="195" font-size="15">结论说了什么</text><rect x="245" y="100" width="205" height="140" rx="12" fill="white" stroke="#b8cce0"/><text x="260" y="145" font-size="22" font-weight="700">我的理由</text><text x="260" y="195" font-size="15">为什么允许这一步</text><rect x="465" y="100" width="205" height="140" rx="12" fill="white" stroke="#b8cce0"/><text x="480" y="145" font-size="22" font-weight="700">核对依据</text><text x="480" y="195" font-size="15">条件与来源在哪里</text><rect x="685" y="100" width="205" height="140" rx="12" fill="white" stroke="#b8cce0"/><text x="700" y="145" font-size="22" font-weight="700">未解问题</text><text x="700" y="195" font-size="15">改变条件会怎样</text><text x="35" y="290" font-size="18">原创教学示意；完整条件与解释见正文。</text></g></svg>
