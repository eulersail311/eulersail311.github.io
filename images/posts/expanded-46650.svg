<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title-46650 desc-46650"><title id="title-46650">容量、速率与等待分别回答什么</title><desc id="desc-46650">突发许可由容量决定，持续补充由速率决定；等待说明最早可能通过的时刻，不是预约。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#1c6275"/></marker></defs><rect width="900" height="360" fill="#f8fafc"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#172b45"><text x="36" y="38" font-size="24" font-weight="700">容量、速率与等待分别回答什么</text><text x="36" y="69" font-size="17" fill="#1c6275">步骤关系：箭头表示本图的处理或观察顺序</text><rect x="36" y="99" width="240" height="175" rx="12" fill="white" stroke="#1c6275" stroke-width="1.5"/><path d="M48 99 H264" stroke="#1c6275" stroke-width="4"/><text x="52" y="133" font-size="20" font-weight="700" fill="#1c6275">容量3且初始满桶</text><text x="52" y="198" font-size="18">同刻三次单位请求可通过</text><path d="M283 185 H317" stroke="#1c6275" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="99" width="240" height="175" rx="12" fill="white" stroke="#1c6275" stroke-width="1.5"/><path d="M342 99 H558" stroke="#1c6275" stroke-width="4"/><text x="346" y="133" font-size="20" font-weight="700" fill="#1c6275">第四次同刻到达</text><text x="346" y="198" font-size="18">令牌不足，被拒绝</text><path d="M577 185 H611" stroke="#1c6275" stroke-width="2" marker-end="url(#arrow)"/><rect x="624" y="99" width="240" height="175" rx="12" fill="white" stroke="#1c6275" stroke-width="1.5"/><path d="M636 99 H852" stroke="#1c6275" stroke-width="4"/><text x="640" y="133" font-size="20" font-weight="700" fill="#1c6275">速率每秒2</text><text x="640" y="198" font-size="18">半秒后补出一个令牌</text><text x="36" y="319" font-size="17">依据本文已有情境绘制 · 不表示生产测量或通用性能保证</text></g></svg>
