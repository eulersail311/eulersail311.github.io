<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">同一组率，不同的流量构成</title><desc id="desc">A 两组成功率均高于 B，但 A 只有一成新用户，B 有九成；共同各半权重下 A 为六成，B 为五成。</desc>
  <rect width="900" height="520" rx="20" fill="#f4f7fb"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" fill="#253d56">
    <text x="38" y="47" font-size="27" font-weight="700">总体反转，发生在权重里</text>
    <rect x="40" y="71" width="18" height="18" rx="3" fill="#347ea0"/><text x="68" y="87" font-size="17">新用户</text>
    <rect x="174" y="71" width="18" height="18" rx="3" fill="#bd6c3e"/><text x="202" y="87" font-size="17">回访用户</text>
    <g fill="#fff" stroke="#becddd"><rect x="38" y="114" width="392" height="227" rx="14"/><rect x="470" y="114" width="392" height="227" rx="14"/></g>
    <text x="60" y="148" font-size="21" font-weight="700">模型 A：组内 80% / 40%</text>
    <text x="492" y="148" font-size="21" font-weight="700">模型 B：组内 70% / 30%</text>
    <text x="60" y="185" font-size="17">实际流量：新用户占 10%</text><text x="492" y="185" font-size="17">实际流量：新用户占 90%</text>
    <rect x="60" y="204" width="34" height="38" fill="#347ea0"/><rect x="94" y="204" width="306" height="38" fill="#bd6c3e"/>
    <rect x="492" y="204" width="306" height="38" fill="#347ea0"/><rect x="798" y="204" width="34" height="38" fill="#bd6c3e"/>
    <text x="60" y="278" font-size="19">0.1 × 0.8 + 0.9 × 0.4</text><text x="492" y="278" font-size="19">0.9 × 0.7 + 0.1 × 0.3</text>
    <text x="60" y="316" font-size="25" font-weight="700">原总体 44%</text><text x="492" y="316" font-size="25" font-weight="700">原总体 66%</text>
    <rect x="38" y="365" width="824" height="116" rx="14" fill="#e5efe9" stroke="#aac6b7"/>
    <text x="60" y="399" font-size="21" font-weight="700" fill="#285d49">改用共同权重：新用户 50%，回访用户 50%</text>
    <text x="60" y="434" font-size="21" fill="#285d49">A = 60%　　B = 50%　　差值 = +10 个百分点</text>
    <text x="60" y="463" font-size="16" fill="#285d49">两个总体回答不同问题；标准化计算本身不构成因果识别。</text>
  </g>
</svg>
