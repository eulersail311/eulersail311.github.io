<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="续传之前，先验证表示版本"><rect width="900" height="400" rx="16" fill="#f8fafc"/><g font-family="'Microsoft YaHei',sans-serif" fill="#183044"><text x="36" y="42" font-size="24" font-weight="700">续传之前，先验证表示版本</text><text x="36" y="72" font-size="16">人工构造的状态分支；没有实测某个服务器或CDN</text><rect x="36" y="108" width="828" height="60" rx="10" fill="#e2e8f0"/><text x="60" y="145" font-size="20">本地前缀 + 原强ETag → Range 与 If-Range</text><path d="M450 168 V192 H240 V215 M450 192 H660 V215" fill="none" stroke="#3d6780" stroke-width="3"/><rect x="36" y="220" width="396" height="105" rx="10" fill="#d4f1e4"/><rect x="468" y="220" width="396" height="105" rx="10" fill="#fff0cb"/><text x="58" y="253" font-size="19" font-weight="700">匹配且按范围处理：206</text><text x="58" y="289" font-size="17">核对位置、编码与身份后接续</text><text x="490" y="253" font-size="19" font-weight="700">不匹配：忽略Range</text><text x="490" y="289" font-size="17">普通GET的200走完整候选流程</text><text x="36" y="370" font-size="18">服务器也可忽略Range；200正文不可直接追加到旧前缀。</text></g></svg>
