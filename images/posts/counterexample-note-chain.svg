<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="把反例保留在笔记里，而不只写下结论"><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:19px;fill:#253b4b}.title{font-size:26px;font-weight:700}.bold{font-weight:700}.small{font-size:17px}.card{fill:#edf5f3;stroke:#9abfb4;stroke-width:2}</style><rect width="900" height="420" rx="16" fill="#fbfdfc"/><text class="title" x="30" y="45">把反例保留在笔记里，而不只写下结论</text><rect class="card" x="20" y="110" width="160" height="230" rx="12"/><text class="bold" x="38" y="153">1｜原主张</text><text class="small" x="35" y="213">对象是谁？</text><text class="small" x="35" y="258">“都”还是“有”？</text><rect class="card" x="195" y="110" width="160" height="230" rx="12"/><text class="bold" x="213" y="153">2｜前提</text><text class="small" x="210" y="213">哪些条件</text><text class="small" x="210" y="258">必须先满足？</text><rect class="card" x="370" y="110" width="160" height="230" rx="12"/><text class="bold" x="388" y="153">3｜候选对象</text><text class="small" x="385" y="213">确实在范围内</text><text class="small" x="385" y="258">且满足前提吗？</text><rect class="card" x="545" y="110" width="160" height="230" rx="12"/><text class="bold" x="563" y="153">4｜独立核算</text><text class="small" x="560" y="213">怎样确认</text><text class="small" x="560" y="258">结论真的失败？</text><rect class="card" x="720" y="110" width="160" height="230" rx="12"/><text class="bold" x="738" y="153">5｜边界修订</text><text class="small" x="735" y="213">只保留证据支持</text><text class="small" x="735" y="258">的范围与强度</text><text class="small" x="30" y="390">记录失效机制与观察时刻；没有找到反例，不等于已经证明。</text></svg>
