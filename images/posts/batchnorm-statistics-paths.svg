<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">BatchNorm 的统计量与梯度路径</title><desc id="desc">训练输入经直接路径、批次均值与批次方差共同影响输出；运行统计由移动平均更新，评估使用固定统计量。</desc><rect width="900" height="520" rx="20" fill="#f4f7fb"/><g font-family="Microsoft YaHei, sans-serif" fill="#18384f"><text x="40" y="48" font-size="26" font-weight="700">同一通道，三条反向路径</text><rect x="40" y="100" width="210" height="145" rx="16" fill="#e2eff3" stroke="#377b98" stroke-width="2"/><text x="62" y="140" font-size="23">输入 x₁ … xM</text><text x="62" y="180" font-size="19">直接路径</text><text x="62" y="216" font-size="19">统计量路径</text><g fill="#e1efe7" stroke="#36765b" stroke-width="2"><rect x="335" y="100" width="200" height="62" rx="12"/><rect x="335" y="193" width="200" height="62" rx="12"/></g><text x="357" y="140" font-size="23">批次均值 μ</text><text x="357" y="233" font-size="23">批次方差 v</text><rect x="620" y="100" width="240" height="155" rx="16" fill="#e9e8f5" stroke="#675f9b" stroke-width="2"/><text x="644" y="140" font-size="22">归一化 z</text><text x="644" y="181" font-size="22">输出 y = γz + β</text><text x="644" y="221" font-size="18">上游梯度 g</text><g stroke="#377b98" stroke-width="3" fill="none"><path d="M250 130 H333 M250 220 H333 M535 131 H618 M535 224 H618"/><path d="M145 100 V77 H740 V100"/></g><rect x="40" y="305" width="820" height="132" rx="16" fill="#fff" stroke="#acbbc9" stroke-width="2"/><text x="62" y="344" font-size="23" font-weight="700">运行统计：跨批次更新的缓冲量</text><text x="62" y="382" font-size="20">训练更新移动平均；评估使用冻结值；不经优化器求梯度</text><text x="62" y="416" font-size="19">当前前向方差分母 M；运行方差更新使用 M−1 校正</text><text x="40" y="478" font-size="18">原创计算关系图 · 单通道示意 · 非训练性能实测</text></g></svg>
