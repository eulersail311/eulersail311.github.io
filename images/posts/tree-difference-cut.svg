<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">切边证明与输入边编号映射</title>
  <desc id="desc">切开父边后，子树内端点数为零、一、二时的差分和分别为零、一、零。手算六条输入边的答案为2、2、1、2、1、1。</desc>
  <rect width="900" height="520" rx="20" fill="#f7fafc"/>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#183348">
    <text x="30" y="44" font-size="25" font-weight="700">一条边只关心：两端点是否分居两侧？</text>
    <text x="30" y="76" font-size="16">S 为删去父边后留下的完整子树，w 为这次路径的最近公共祖先。</text>
    <g stroke="#bdced9" fill="#fff"><rect x="30" y="98" width="260" height="222" rx="14"/><rect x="320" y="98" width="260" height="222" rx="14"/><rect x="610" y="98" width="260" height="222" rx="14"/></g>
    <g font-size="19" font-weight="700" text-anchor="middle"><text x="160" y="132">没有端点在 S 内</text><text x="450" y="132">只有一个端点在 S 内</text><text x="740" y="132">两个端点都在 S 内</text></g>
    <g fill="#eaf2f7" stroke="#7898ad" stroke-dasharray="5 4"><rect x="63" y="156" width="194" height="78" rx="12"/><rect x="353" y="156" width="194" height="78" rx="12"/><rect x="643" y="156" width="194" height="78" rx="12"/></g>
    <g text-anchor="middle" font-size="18"><text x="160" y="188">S：无端点</text><text x="160" y="216">w 在外</text><text x="450" y="188">S：a 在内，b 在外</text><text x="450" y="216">w 在外</text><text x="740" y="188">S：a、b 都在内</text><text x="740" y="216">w 也在内</text></g>
    <g text-anchor="middle" font-size="21" font-weight="700"><text x="160" y="268">0 + 0 − 0 = 0</text><text x="450" y="268" fill="#9c4511">1 + 0 − 0 = 1</text><text x="740" y="268">1 + 1 − 2 = 0</text></g>
    <g text-anchor="middle" font-size="17"><text x="160" y="299">不经过父边</text><text x="450" y="299" fill="#9c4511">恰好经过一次</text><text x="740" y="299">不经过父边</text></g>
    <text x="30" y="357" font-size="21" font-weight="700">七点手算：答案最终回到输入边序</text>
    <g fill="#eaf2f7"><rect x="30" y="376" width="130" height="96" rx="10"/><rect x="172" y="376" width="130" height="96" rx="10"/><rect x="314" y="376" width="130" height="96" rx="10"/><rect x="456" y="376" width="130" height="96" rx="10"/><rect x="598" y="376" width="130" height="96" rx="10"/><rect x="740" y="376" width="130" height="96" rx="10"/></g>
    <g text-anchor="middle" font-size="17"><text x="95" y="407">① 2—4</text><text x="237" y="407">② 1—2</text><text x="379" y="407">③ 3—6</text><text x="521" y="407">④ 1—3</text><text x="663" y="407">⑤ 2—5</text><text x="805" y="407">⑥ 3—7</text></g>
    <g text-anchor="middle" font-size="28" font-weight="700" fill="#1c5b80"><text data-edge="1" x="95" y="451">2</text><text data-edge="2" x="237" y="451">2</text><text data-edge="3" x="379" y="451">1</text><text data-edge="4" x="521" y="451">2</text><text data-edge="5" x="663" y="451">1</text><text data-edge="6" x="805" y="451">1</text></g>
    <text x="30" y="501" font-size="16">手算包含 4→5、4→6、2→7、3→3；答案总和 9 等于路径长度之和。</text>
  </g>
</svg>
