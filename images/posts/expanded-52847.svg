<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title-52847 desc-52847"><title id="title-52847">bisect之前先让判定器可复现</title><desc id="desc-52847">Git搜索正确执行也不能修复不稳定标签；无关构建错误与目标缺陷的存在需要区分。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#47652c"/></marker></defs><rect width="900" height="360" fill="#f8fafc"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#172b45"><text x="36" y="38" font-size="24" font-weight="700">bisect之前先让判定器可复现</text><text x="36" y="69" font-size="17" fill="#47652c">步骤关系：箭头表示本图的处理或观察顺序</text><rect x="36" y="99" width="240" height="175" rx="12" fill="white" stroke="#47652c" stroke-width="1.5"/><path d="M48 99 H264" stroke="#47652c" stroke-width="4"/><text x="52" y="133" font-size="20" font-weight="700" fill="#47652c">同一提交时过时败</text><text x="52" y="198" font-size="18">先定位外部服务或输入变</text><text x="52" y="228" font-size="18">化</text><path d="M283 185 H317" stroke="#47652c" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="99" width="240" height="175" rx="12" fill="white" stroke="#47652c" stroke-width="1.5"/><path d="M342 99 H558" stroke="#47652c" stroke-width="4"/><text x="346" y="133" font-size="20" font-weight="700" fill="#47652c">固定判定环境</text><text x="346" y="198" font-size="18">只检查目标缺陷相关行为</text><path d="M577 185 H611" stroke="#47652c" stroke-width="2" marker-end="url(#arrow)"/><rect x="624" y="99" width="240" height="175" rx="12" fill="white" stroke="#47652c" stroke-width="1.5"/><path d="M636 99 H852" stroke="#47652c" stroke-width="4"/><text x="640" y="133" font-size="20" font-weight="700" fill="#47652c">无法可靠判断</text><text x="640" y="198" font-size="18">明确跳过而非强判为坏</text><text x="36" y="319" font-size="17">依据本文已有情境绘制 · 不表示生产测量或通用性能保证</text></g></svg>
