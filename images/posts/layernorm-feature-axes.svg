<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">逐行统计，逐特征共享参数</title><desc id="desc">两行1、2、3与11、12、13分别统计，均值2和12，方差均为三分之二。epsilon取三分之一时归一化值都是负一、零、一。gamma与beta按列共享。</desc><rect width="900" height="520" rx="20" fill="#f4f1fa"/><g font-family="Microsoft YaHei,sans-serif" fill="#3d3454"><text x="40" y="52" font-size="27" font-weight="bold">LayerNorm：统计不跨行，参数跨行共享</text><text x="40" y="91" font-size="19">把 (B,T,H) 的外部位置展成两行，D=H=3；ε=1/3 为教学取值</text><g fill="#fff"><rect x="40" y="125" width="820" height="96" rx="12"/><rect x="40" y="239" width="820" height="96" rx="12"/></g><g font-size="22"><text x="60" y="163">行 1</text><text x="60" y="277">行 2</text><text x="580" y="163">μ=2，v=2/3</text><text x="580" y="277">μ=12，v=2/3</text><text x="580" y="197">z=[−1, 0, 1]</text><text x="580" y="311">z=[−1, 0, 1]</text></g><g fill="#ddd5ee"><rect x="190" y="140" width="90" height="65" rx="8"/><rect x="310" y="140" width="90" height="65" rx="8"/><rect x="430" y="140" width="90" height="65" rx="8"/><rect x="190" y="254" width="90" height="65" rx="8"/><rect x="310" y="254" width="90" height="65" rx="8"/><rect x="430" y="254" width="90" height="65" rx="8"/></g><g text-anchor="middle" font-size="26"><text x="235" y="183">1</text><text x="355" y="183">2</text><text x="475" y="183">3</text><text x="235" y="297">11</text><text x="355" y="297">12</text><text x="475" y="297">13</text></g><path d="M235 345 V375 M355 345 V375 M475 345 V375" stroke="#8670a9" stroke-width="3"/><g font-size="20"><text x="60" y="407">共享参数</text><text x="190" y="407">γ₁=1</text><text x="310" y="407">γ₂=2</text><text x="430" y="407">γ₃=3</text><text x="190" y="443">β₁=0</text><text x="310" y="443">β₂=1</text><text x="430" y="443">β₃=−1</text><text x="580" y="407">两行 y 都为</text><text x="580" y="443">[−1, 1, 2]</text></g><text x="40" y="493" font-size="18">原创计算示意；逐行独立只描述该局部算子，不表示前面的注意力没有行间依赖。</text></g></svg>
