<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title-45892 desc-45892"><title id="title-45892">同一过滤条件，投影列可改变读取工作</title><desc id="desc-45892">先明确查询要返回哪些列，再解释覆盖访问；计划文本本身不提供固定的毫秒收益。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#1c6275"/></marker></defs><rect width="900" height="360" fill="#f8fafc"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#172b45"><text x="36" y="38" font-size="24" font-weight="700">同一过滤条件，投影列可改变读取工作</text><text x="36" y="69" font-size="17" fill="#1c6275">并列对照：卡片宽度不表示数量、时长或比例</text><rect x="36" y="99" width="240" height="175" rx="12" fill="white" stroke="#1c6275" stroke-width="1.5"/><path d="M48 99 H264" stroke="#1c6275" stroke-width="4"/><text x="52" y="133" font-size="20" font-weight="700" fill="#1c6275">只取索引内列</text><text x="52" y="198" font-size="18">所需数据可能在索引条目</text><text x="52" y="228" font-size="18">中</text><rect x="330" y="99" width="240" height="175" rx="12" fill="white" stroke="#1c6275" stroke-width="1.5"/><path d="M342 99 H558" stroke="#1c6275" stroke-width="4"/><text x="346" y="133" font-size="20" font-weight="700" fill="#1c6275">再取索引外大字段</text><text x="346" y="198" font-size="18">可能增加表记录读取</text><rect x="624" y="99" width="240" height="175" rx="12" fill="white" stroke="#1c6275" stroke-width="1.5"/><path d="M636 99 H852" stroke="#1c6275" stroke-width="4"/><text x="640" y="133" font-size="20" font-weight="700" fill="#1c6275">比较执行计划</text><text x="640" y="198" font-size="18">不能仅凭索引名称断言等</text><text x="640" y="228" font-size="18">成本</text><text x="36" y="319" font-size="17">依据本文已有情境绘制 · 不表示生产测量或通用性能保证</text></g></svg>
