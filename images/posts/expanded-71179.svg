<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title-71179 desc-71179"><title id="title-71179">反例之后还要修订成可用规则</title><desc id="desc-71179">反例否定全称，不证明均值无用；修订句仍应能指导检查，而非退回无法核对的有时有用。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#665027"/></marker></defs><rect width="900" height="360" fill="#f8fafc"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#172b45"><text x="36" y="38" font-size="24" font-weight="700">反例之后还要修订成可用规则</text><text x="36" y="69" font-size="17" fill="#665027">步骤关系：箭头表示本图的处理或观察顺序</text><rect x="36" y="99" width="240" height="175" rx="12" fill="white" stroke="#665027" stroke-width="1.5"/><path d="M48 99 H264" stroke="#665027" stroke-width="4"/><text x="52" y="133" font-size="20" font-weight="700" fill="#665027">原全称断言</text><text x="52" y="198" font-size="18">平均数都代表典型对象</text><path d="M283 185 H317" stroke="#665027" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="99" width="240" height="175" rx="12" fill="white" stroke="#665027" stroke-width="1.5"/><path d="M342 99 H558" stroke="#665027" stroke-width="4"/><text x="346" y="133" font-size="20" font-weight="700" fill="#665027">构造反例</text><text x="346" y="198" font-size="18">分布极不同也可能均值相</text><text x="346" y="228" font-size="18">同</text><path d="M577 185 H611" stroke="#665027" stroke-width="2" marker-end="url(#arrow)"/><rect x="624" y="99" width="240" height="175" rx="12" fill="white" stroke="#665027" stroke-width="1.5"/><path d="M636 99 H852" stroke="#665027" stroke-width="4"/><text x="640" y="133" font-size="20" font-weight="700" fill="#665027">保留适用条件</text><text x="640" y="198" font-size="18">补统计目的偏斜与分组信</text><text x="640" y="228" font-size="18">息</text><text x="36" y="319" font-size="17">依据本文已有情境绘制 · 不表示生产测量或通用性能保证</text></g></svg>
