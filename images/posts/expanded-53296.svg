<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title-53296 desc-53296"><title id="title-53296">审查范围先区分对象，再解释结果</title><desc id="desc-53296">快照差异与提交集合回答不同问题；净变化不能代替历史，多个最佳祖先也需要明确比较策略。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#47652c"/></marker></defs><rect width="900" height="360" fill="#f8fafc"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#172b45"><text x="36" y="38" font-size="24" font-weight="700">审查范围先区分对象，再解释结果</text><text x="36" y="69" font-size="17" fill="#47652c">并列对照：卡片宽度不表示数量、时长或比例</text><rect x="36" y="99" width="240" height="175" rx="12" fill="white" stroke="#47652c" stroke-width="1.5"/><path d="M48 99 H264" stroke="#47652c" stroke-width="4"/><text x="52" y="133" font-size="20" font-weight="700" fill="#47652c">端点快照</text><text x="52" y="198" font-size="18">比较两个版本最后留下的</text><text x="52" y="228" font-size="18">净变化</text><rect x="330" y="99" width="240" height="175" rx="12" fill="white" stroke="#47652c" stroke-width="1.5"/><path d="M342 99 H558" stroke="#47652c" stroke-width="4"/><text x="346" y="133" font-size="20" font-weight="700" fill="#47652c">可达提交集合</text><text x="346" y="198" font-size="18">记录哪些提交不在另一侧</text><text x="346" y="228" font-size="18">可达</text><rect x="624" y="99" width="240" height="175" rx="12" fill="white" stroke="#47652c" stroke-width="1.5"/><path d="M636 99 H852" stroke="#47652c" stroke-width="4"/><text x="640" y="133" font-size="20" font-weight="700" fill="#47652c">共同祖先基线</text><text x="640" y="198" font-size="18">再确认三点比较的方向与</text><text x="640" y="228" font-size="18">边界</text><text x="36" y="319" font-size="17">依据本文已有情境绘制 · 不表示生产测量或通用性能保证</text></g></svg>
