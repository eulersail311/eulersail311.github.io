<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-label="不同微批均值的正确与错误权重"><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:19px;fill:#263c4a}.title{font-size:26px;font-weight:700}.bold{font-weight:700}.small{font-size:17px}.card{fill:#edf5f3;stroke:#9dbeb5;stroke-width:2}</style><rect width="900" height="440" rx="16" fill="#fbfdfc"/><text class="title" x="30" y="42">微批均值相加前，先核对每批的分母</text><rect class="card" x="35" y="90" width="400" height="245" rx="12"/><rect class="card" x="465" y="90" width="400" height="245" rx="12"/><text class="bold" x="55" y="135">正确：按有效记录数加权</text><text x="55" y="195">2条记录：均值2.5 × 2/3</text><text x="55" y="250">1条记录：均值9 × 1/3</text><text class="bold" x="55" y="305">合成梯度：14/3 ≈ 4.666667</text><text class="bold" x="485" y="135">错误：把两个均值再平均</text><text x="485" y="195">2条记录：均值2.5 × 1/2</text><text x="485" y="250">1条记录：均值9 × 1/2</text><text class="bold" x="485" y="305">得到5.75，改变记录权重</text><text class="small" x="30" y="397">所有梯度固定在w=1；框宽不表示显存、耗时或概率。</text></svg>
