<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">Git revert -m：先选择比较的父基线</title>
  <desc id="desc">第一父P1为功能关新说明，第二父P2为功能开旧说明。合并M为功能开新说明。紧接M撤销时，主线1得到功能关新说明，主线2得到功能开旧说明。两个操作分别在独立历史中比较，不是连续执行。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#596b83"/></marker></defs>
  <rect width="900" height="540" rx="20" fill="#f6f8fc"/>
  <g font-family="'Microsoft YaHei','PingFang SC',sans-serif" fill="#172941">
    <text x="40" y="47" font-size="24" font-weight="700">同一个合并 M，不同父基线对应不同逆向变化</text>
    <text x="40" y="79" font-size="15" fill="#52637b">本图把撤销直接接在 M 后 · 右侧为两种独立选择，不能按顺序照做</text>
    <g fill="#fff" stroke="#c8d3e3" stroke-width="2">
      <rect x="40" y="121" width="204" height="110" rx="13"/>
      <rect x="40" y="280" width="204" height="110" rx="13"/>
      <rect x="335" y="202" width="198" height="110" rx="13"/>
    </g>
    <rect x="641" y="121" width="219" height="110" rx="13" fill="#edf4ff" stroke="#386dba" stroke-width="2"/>
    <rect x="641" y="280" width="219" height="110" rx="13" fill="#edf6f1" stroke="#3f7a61" stroke-width="2"/>
    <g font-size="18" font-weight="700" text-anchor="middle">
      <text x="142" y="154">P1 · 第一父</text><text x="142" y="313">P2 · 第二父</text>
      <text x="434" y="236">M · 两父合并</text><text x="750" y="154" fill="#255394">选择 -m 1</text><text x="750" y="313" fill="#296148">选择 -m 2</text>
    </g>
    <g font-size="17" text-anchor="middle">
      <text x="142" y="190">功能关 · 新说明</text><text x="142" y="349">功能开 · 旧说明</text>
      <text x="434" y="273">功能开 · 新说明</text><text x="750" y="190">功能关 · 新说明</text><text x="750" y="349">功能开 · 旧说明</text>
    </g>
    <g fill="none" stroke="#596b83" stroke-width="2.4" marker-end="url(#arrow)">
      <path d="M244 176C292 176 291 237 335 237"/>
      <path d="M244 335C292 335 291 278 335 278"/>
      <path d="M533 237C582 237 590 176 641 176"/>
      <path d="M533 278C582 278 590 335 641 335"/>
    </g>
    <text x="587" y="145" font-size="14" text-anchor="middle" fill="#255394">反向 P1→M</text>
    <text x="587" y="382" font-size="14" text-anchor="middle" fill="#296148">反向 P2→M</text>
    <rect x="40" y="429" width="820" height="76" rx="13" fill="#e7edf7"/>
    <text x="62" y="459" font-size="18" font-weight="700">-m 选择比较基线；它不删除任何父提交。</text>
    <text x="62" y="488" font-size="15">撤销之后 M 与两个父提交仍可到达；后续合并仍会利用这些祖先关系。</text>
  </g>
</svg>
