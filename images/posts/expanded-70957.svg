<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title-70957 desc-70957"><title id="title-70957">遮住方法名，再按目标选工具</title><desc id="desc-70957">选错情境和说错理由是两种缺口；交错练习应分别记录，而不是只给一个总分。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#665027"/></marker></defs><rect width="900" height="360" fill="#f8fafc"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#172b45"><text x="36" y="38" font-size="24" font-weight="700">遮住方法名，再按目标选工具</text><text x="36" y="69" font-size="17" fill="#665027">并列对照：卡片宽度不表示数量、时长或比例</text><rect x="36" y="99" width="240" height="175" rx="12" fill="white" stroke="#665027" stroke-width="1.5"/><path d="M48 99 H264" stroke="#665027" stroke-width="4"/><text x="52" y="133" font-size="20" font-weight="700" fill="#665027">比较未暂存内容</text><text x="52" y="198" font-size="18">选择diff并说明比较两端</text><rect x="330" y="99" width="240" height="175" rx="12" fill="white" stroke="#665027" stroke-width="1.5"/><path d="M342 99 H558" stroke="#665027" stroke-width="4"/><text x="346" y="133" font-size="20" font-weight="700" fill="#665027">抵消已共享修改</text><text x="346" y="198" font-size="18">选择revert并保留历史</text><rect x="624" y="99" width="240" height="175" rx="12" fill="white" stroke="#665027" stroke-width="1.5"/><path d="M636 99 H852" stroke="#665027" stroke-width="4"/><text x="640" y="133" font-size="20" font-weight="700" fill="#665027">固定日志候选</text><text x="640" y="198" font-size="18">用reflog定位后建立引用</text><text x="36" y="319" font-size="17">依据本文已有情境绘制 · 不表示生产测量或通用性能保证</text></g></svg>
