<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-label="三个热块热容对应的最终平衡"><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:19px;fill:#263c4a}.title{font-size:26px;font-weight:700}.bold{font-weight:700}.small{font-size:17px}.card{fill:#edf5f3;stroke:#9dbeb5;stroke-width:2}</style><rect width="900" height="440" rx="16" fill="#fbfdfc"/><text class="title" x="30" y="42">热块热容不同，平衡可能落在三个分段</text><rect class="card" x="30" y="100" width="260" height="235" rx="12"/><text class="bold" x="46" y="150">C_h = 400J/K</text><text class="bold" x="46" y="220">42.857143°C</text><text x="46" y="285">f=0，全固态</text><rect class="card" x="320" y="100" width="260" height="235" rx="12"/><text class="bold" x="336" y="150">C_h = 2000J/K</text><text class="bold" x="336" y="220">50°C</text><text x="336" y="285">f=0.7，两相</text><rect class="card" x="610" y="100" width="260" height="235" rx="12"/><text class="bold" x="626" y="150">C_h = 10000J/K</text><text class="bold" x="626" y="220">80.833333°C</text><text x="626" y="285">f=1，全液态</text><text class="small" x="30" y="392">样品1kg、20°C全固态；热块初始100°C；不表示过程时长。</text></svg>
