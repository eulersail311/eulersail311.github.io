<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">奏鸣曲式的两条观察线</title><desc id="desc">主题材料与调性位置分别记录。呈示部建立对比，展开部加工材料，再现部重新安置于主调。为常见布局示意，不是所有作品的固定模板。</desc><rect width="900" height="450" rx="20" fill="#faf5ee"/><g font-family="Microsoft YaHei, sans-serif" fill="#49344b"><text x="40" y="52" font-size="27" font-weight="bold">熟悉主题回来了，调性也回来了吗？</text><text x="40" y="91" font-size="19">常见奏鸣曲式的观察框架 · 等宽不代表等时长，不指定具体作品</text><g fill="#eee6f4"><rect x="180" y="125" width="210" height="57" rx="10"/><rect x="410" y="125" width="210" height="57" rx="10"/><rect x="640" y="125" width="210" height="57" rx="10"/></g><g text-anchor="middle" font-size="24"><text x="285" y="163">呈示部</text><text x="515" y="163">展开部</text><text x="745" y="163">再现部</text></g><g font-size="20"><text x="45" y="238">材料线</text><text x="200" y="238">提出主要材料</text><text x="430" y="238">拆分、组合与加工</text><text x="660" y="238">主要材料返回</text><text x="45" y="315">调性线</text><text x="200" y="315">主调 → 对比调</text><text x="430" y="315">中心游移与不稳定</text><text x="660" y="315">在主调重新安置</text></g><path d="M45 263 H850 M45 342 H850" stroke="#cbbdce" stroke-width="2"/><text x="45" y="390" font-size="19">只写 A—B—A，会漏掉相似材料在不同调性位置承担的不同任务。</text><text x="45" y="421" font-size="18">具体作品可能扩展、重排或省略某些功能，应结合实际听觉与乐谱判断。</text></g></svg>
