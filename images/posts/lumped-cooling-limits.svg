<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="快一点之前，重新检查近似"><rect width="900" height="400" rx="16" fill="#f8fafc"/><g font-family="'Microsoft YaHei',sans-serif" fill="#183044"><text x="36" y="42" font-size="24" font-weight="700">快一点之前，重新检查近似</text><text x="36" y="72" font-size="16">合成参数；卡片不按数值比例绘制</text><rect x="36" y="108" width="260" height="214" rx="12" fill="#d4f1e4"/><rect x="320" y="108" width="260" height="214" rx="12" fill="#fff0cb"/><rect x="604" y="108" width="260" height="214" rx="12" fill="#d9eef8"/><text x="56" y="144" font-size="20" font-weight="700">基准模型</text><text x="56" y="190" font-size="19">τ ≈ 27.778s</text><text x="56" y="230" font-size="19">Bi = 0.002</text><text x="56" y="280" font-size="16">内部近等温有量级依据</text><text x="340" y="144" font-size="20" font-weight="700">h提高100倍</text><text x="340" y="190" font-size="19">τ ≈ 0.278s</text><text x="340" y="230" font-size="19">Bi = 0.2</text><text x="340" y="280" font-size="16">不能沿用很小Bi的理由</text><text x="624" y="144" font-size="20" font-weight="700">相似尺寸放大2倍</text><text x="624" y="190" font-size="19">τ ≈ 55.556s</text><text x="624" y="230" font-size="19">Bi = 0.004</text><text x="624" y="280" font-size="16">限定h及物性均保持不变</text><text x="36" y="370" font-size="17">时间预测依赖模型成立；Biot数不是统一的温度误差百分比保证。</text></g></svg>
