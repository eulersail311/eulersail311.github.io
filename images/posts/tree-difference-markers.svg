<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">一条路径的端点标记与 LCA 抵消</title>
  <desc id="desc">七点树中路径4到6的端点各加1，最近公共祖先1减2。子树2与3各汇总为1，根汇总为0。</desc>
  <rect width="900" height="520" rx="20" fill="#f7fafc"/>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#183348">
    <text x="34" y="46" font-size="25" font-weight="700">4 → 6：两端加一，会合处减二</text>
    <text x="34" y="77" font-size="16">橙色是路径上的边；带符号的数字是点上的初始标记。</text>
    <g fill="none" stroke-linecap="round" stroke-width="6">
      <path d="M320 140L180 250L100 365 M320 140L460 250L380 365" stroke="#be5b17"/>
      <path d="M180 250L260 365 M460 250L540 365" stroke="#becbd5"/>
    </g>
    <g fill="#fff" stroke="#416a82" stroke-width="3">
      <circle cx="320" cy="140" r="25"/><circle cx="180" cy="250" r="25"/><circle cx="460" cy="250" r="25"/>
      <circle cx="100" cy="365" r="25"/><circle cx="260" cy="365" r="25"/><circle cx="380" cy="365" r="25"/><circle cx="540" cy="365" r="25"/>
    </g>
    <g text-anchor="middle" font-size="23" font-weight="700">
      <text x="320" y="148">1</text><text x="180" y="258">2</text><text x="460" y="258">3</text>
      <text x="100" y="373">4</text><text x="260" y="373">5</text><text x="380" y="373">6</text><text x="540" y="373">7</text>
    </g>
    <rect x="364" y="113" width="148" height="43" rx="10" fill="#fff0e4"/>
    <text x="380" y="141" font-size="19" font-weight="700" fill="#8d3b10">LCA：−2</text>
    <g fill="#fff0e4"><rect x="65" y="404" width="70" height="34" rx="8"/><rect x="345" y="404" width="70" height="34" rx="8"/></g>
    <g text-anchor="middle" font-size="20" font-weight="700" fill="#8d3b10"><text x="100" y="428">+1</text><text x="380" y="428">+1</text></g>
    <rect x="620" y="108" width="246" height="330" rx="14" fill="#eaf2f7"/>
    <text x="640" y="146" font-size="20" font-weight="700">向上收集</text>
    <text x="640" y="188" font-size="18">子树 2：1 + 0 = 1</text>
    <text x="640" y="226" font-size="18">子树 3：1 + 0 = 1</text>
    <path d="M640 248H846" stroke="#a8becd"/>
    <text x="640" y="284" font-size="18">根：−2 + 1 + 1 = 0</text>
    <text x="640" y="334" font-size="17">父边取得子树和，</text><text x="640" y="366" font-size="17">根上方不再有贡献。</text>
    <text x="640" y="408" font-size="16">其余点的初始标记为 0</text>
    <rect x="34" y="462" width="832" height="38" rx="8" fill="#eaf2f7"/>
    <text x="50" y="488" font-size="17">只有 4—2、2—1、1—3、3—6 四条边得到 1；这是教学演算，不是运行耗时图。</text>
  </g>
</svg>
