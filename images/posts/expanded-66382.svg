<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title-66382 desc-66382"><title id="title-66382">高一致率可能主要来自类别倾向</title><desc id="desc-66382">kappa为0不表示记录完全无用，而是当前类别倾向下该指标没有体现额外的一致信息。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#5a4087"/></marker></defs><rect width="900" height="360" fill="#f8fafc"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#172b45"><text x="36" y="38" font-size="24" font-weight="700">高一致率可能主要来自类别倾向</text><text x="36" y="69" font-size="17" fill="#5a4087">并列对照：卡片宽度不表示数量、时长或比例</text><rect x="36" y="99" width="240" height="175" rx="12" fill="white" stroke="#5a4087" stroke-width="1.5"/><path d="M48 99 H264" stroke="#5a4087" stroke-width="4"/><text x="52" y="133" font-size="20" font-weight="700" fill="#5a4087">20条双人标注</text><text x="52" y="198" font-size="18">19条一致，观察一致率</text><text x="52" y="228" font-size="18">19/20</text><rect x="330" y="99" width="240" height="175" rx="12" fill="white" stroke="#5a4087" stroke-width="1.5"/><path d="M342 99 H558" stroke="#5a4087" stroke-width="4"/><text x="346" y="133" font-size="20" font-weight="700" fill="#5a4087">一位始终给甲类</text><text x="346" y="198" font-size="18">边际偶然一致也为19/20</text><rect x="624" y="99" width="240" height="175" rx="12" fill="white" stroke="#5a4087" stroke-width="1.5"/><path d="M636 99 H852" stroke="#5a4087" stroke-width="4"/><text x="640" y="133" font-size="20" font-weight="700" fill="#5a4087">kappa结果</text><text x="640" y="198" font-size="18">额外一致项相消，得到0</text><text x="36" y="319" font-size="17">依据本文已有情境绘制 · 不表示生产测量或通用性能保证</text></g></svg>
