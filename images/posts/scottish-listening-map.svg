<text x="36" y="84" font-size="21">门德尔松第三交响曲：辨认返回、织体与结尾变化</text>
<g fill="#eff6ff" stroke="#bfdbfe"><rect x="36" y="108" width="402" height="142" rx="16"/><rect x="462" y="108" width="402" height="142" rx="16"/></g>
