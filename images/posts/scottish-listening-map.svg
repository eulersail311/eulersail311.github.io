<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc">
<title id="title">Scottish Symphony listening map</title><desc id="desc">Four original listening prompts: introduction and return, light short-note handoffs, song and march contrast, and fast motion giving way to a new broad closing theme. Not a score, waveform or measured timeline.</desc>
