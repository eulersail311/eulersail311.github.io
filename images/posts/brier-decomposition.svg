<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="brier-title brier-desc">
  <title id="brier-title">同一份十二条合成记录的Brier三项分解</title>
  <desc id="brier-desc">All bars use the same 1440 pixels per unit scale. For the article's twelve synthetic observations, uncertainty is 1/4, reliability error 1/24, resolution 1/6, and Brier loss 1/8. Resolution is nonnegative but subtracted in the identity. The chart is arithmetic from synthetic data, not measured calibration improvement.</desc>
  <rect width="900" height="520" rx="20" fill="#f8fbfc"/>
  <g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" fill="#24363b">
    <text x="36" y="45" font-size="25" font-weight="700">总分更低，可靠性误差未必更小</text>
    <text x="36" y="74" font-size="16" fill="#52676d">十二条合成记录；按精确相同预测值分组，三项恒等式成立。</text>
    <g stroke="#d4e1e4" stroke-width="1"><path d="M230 105V380M350 105V380M470 105V380M590 105V380"/></g>
    <g font-size="18" font-weight="700"><text x="42" y="146">+ UNC 不确定性</text><text x="42" y="216">+ REL 可靠性误差</text><text x="42" y="286">− RES 分辨率</text><text x="42" y="356">= BS 总损失</text></g>
    <rect class="brier-bar" data-term="uncertainty" data-value="0.25" x="230" y="120" width="360" height="36" rx="7" fill="#9eb5c0"/>
    <rect class="brier-bar" data-term="reliability" data-value="0.041666666666666664" x="230" y="190" width="60" height="36" rx="7" fill="#bd874a"/>
    <rect class="brier-bar" data-term="resolution" data-value="0.16666666666666666" x="230" y="260" width="240" height="36" rx="7" fill="#68969c"/>
    <rect class="brier-bar" data-term="brier" data-value="0.125" x="230" y="330" width="180" height="36" rx="7" fill="#29767c"/>
    <g font-size="19" font-weight="700"><text x="625" y="146">1/4 = 0.25</text><text x="625" y="216">1/24 ≈ 0.041667</text><text x="625" y="286">1/6 ≈ 0.166667</text><text x="625" y="356">1/8 = 0.125</text></g>
    <rect x="36" y="395" width="827" height="69" rx="12" fill="#e8f0f2"/>
    <text x="56" y="424" font-size="20" font-weight="700">1/24 − 1/6 + 1/4 = 1/8</text>
    <text x="56" y="450" font-size="15" fill="#52676d">条长表示各分量的非负数值；RES 的减号由公式决定。</text>
    <text x="36" y="496" font-size="13" fill="#52676d">恒报 0.5 的基线：REL=0、RES=0、BS=1/4。图为合成手算，不是总体校准或实测收益。</text>
  </g>
</svg>
