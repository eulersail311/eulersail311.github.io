<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320"><title>同一热流率，不同温降</title><rect width="900" height="320" fill="#f5f8fb" rx="16"/><g font-family="Microsoft YaHei,sans-serif" fill="#243b55"><text x="35" y="55" font-size="28" font-weight="700">同一热流率，不同温降</text><rect x="25" y="100" width="205" height="140" rx="12" fill="white" stroke="#b8cce0"/><text x="40" y="145" font-size="22" font-weight="700">热端80°C</text><text x="40" y="195" font-size="15">总温差60K</text><rect x="245" y="100" width="205" height="140" rx="12" fill="white" stroke="#b8cce0"/><text x="260" y="145" font-size="22" font-weight="700">第一层 R=1</text><text x="260" y="195" font-size="15">温降12K</text><rect x="465" y="100" width="205" height="140" rx="12" fill="white" stroke="#b8cce0"/><text x="480" y="145" font-size="22" font-weight="700">界面68°C</text><text x="480" y="195" font-size="15">热流率12W</text><rect x="685" y="100" width="205" height="140" rx="12" fill="white" stroke="#b8cce0"/><text x="700" y="145" font-size="22" font-weight="700">第二层 R=4</text><text x="700" y="195" font-size="15">温降48K → 冷端20°C</text><text x="35" y="290" font-size="18">原创教学示意；完整条件与解释见正文。</text></g></svg>
