<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title-85750 desc-85750"><title id="title-85750">共同面积翻倍的两项独立复查量</title><desc id="desc-85750">在相同端面温差的等面积串联模型中，功率缩放和界面温度提供不同的守恒检查。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#845721"/></marker></defs><rect width="900" height="360" fill="#f8fafc"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#172b45"><text x="36" y="38" font-size="24" font-weight="700">共同面积翻倍的两项独立复查量</text><text x="36" y="69" font-size="17" fill="#845721">步骤关系：箭头表示本图的处理或观察顺序</text><rect x="36" y="99" width="240" height="175" rx="12" fill="white" stroke="#845721" stroke-width="1.5"/><path d="M48 99 H264" stroke="#845721" stroke-width="4"/><text x="52" y="133" font-size="20" font-weight="700" fill="#845721">面积扩大两倍</text><text x="52" y="198" font-size="18">厚度与导热系数保持不变</text><path d="M283 185 H317" stroke="#845721" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="99" width="240" height="175" rx="12" fill="white" stroke="#845721" stroke-width="1.5"/><path d="M342 99 H558" stroke="#845721" stroke-width="4"/><text x="346" y="133" font-size="20" font-weight="700" fill="#845721">两层热阻都减半</text><text x="346" y="198" font-size="18">总热流率变为两倍</text><path d="M577 185 H611" stroke="#845721" stroke-width="2" marker-end="url(#arrow)"/><rect x="624" y="99" width="240" height="175" rx="12" fill="white" stroke="#845721" stroke-width="1.5"/><path d="M636 99 H852" stroke="#845721" stroke-width="4"/><text x="640" y="133" font-size="20" font-weight="700" fill="#845721">热阻比例未变</text><text x="640" y="198" font-size="18">理想界面温度保持不变</text><text x="36" y="319" font-size="17">依据本文已有情境绘制 · 不表示生产测量或通用性能保证</text></g></svg>
