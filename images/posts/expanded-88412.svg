<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title-88412 desc-88412"><title id="title-88412">总体温和与局部阴影可以并存</title><desc id="desc-88412">总印象不应抹去局部的不稳定；给轻盈留下可以逐项复听的声音依据。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#7c3e60"/></marker></defs><rect width="900" height="360" fill="#f8fafc"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#172b45"><text x="36" y="38" font-size="24" font-weight="700">总体温和与局部阴影可以并存</text><text x="36" y="69" font-size="17" fill="#7c3e60">并列对照：卡片宽度不表示数量、时长或比例</text><rect x="36" y="99" width="240" height="175" rx="12" fill="white" stroke="#7c3e60" stroke-width="1.5"/><path d="M48 99 H264" stroke="#7c3e60" stroke-width="4"/><text x="52" y="133" font-size="20" font-weight="700" fill="#7c3e60">整体长段</text><text x="52" y="198" font-size="18">保留明亮温和的总印象</text><rect x="330" y="99" width="240" height="175" rx="12" fill="white" stroke="#7c3e60" stroke-width="1.5"/><path d="M342 99 H558" stroke="#7c3e60" stroke-width="4"/><text x="346" y="133" font-size="20" font-weight="700" fill="#7c3e60">局部变化</text><text x="346" y="198" font-size="18">追踪句尾低音与进入</text><rect x="624" y="99" width="240" height="175" rx="12" fill="white" stroke="#7c3e60" stroke-width="1.5"/><path d="M636 99 H852" stroke="#7c3e60" stroke-width="4"/><text x="640" y="133" font-size="20" font-weight="700" fill="#7c3e60">步伐对照</text><text x="640" y="198" font-size="18">再比较节奏重音和配器</text><text x="36" y="319" font-size="17">聆听观察示意 · 不是谱例、波形或演出时间轴</text></g></svg>
