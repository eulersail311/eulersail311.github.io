<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc"><title id="title">完整年龄计算：16 加 26 等于 42</title><desc id="desc">相对秒时间轴：Date90，请求100，收到104，当前130。Age12加请求耗时4得到16，大于表观年龄14；驻留26后当前年龄42，max-age60剩18。</desc><rect width="900" height="500" rx="20" fill="#eff5fa"/><g font-family="Microsoft YaHei,sans-serif" fill="#24415b"><text x="40" y="52" font-size="27" font-weight="bold">收到响应时，它已经有年龄</text><text x="40" y="91" font-size="19">自拟相对秒；日期与本地时钟取同一基准，不是网络实测</text><path d="M100 175 H780" stroke="#597e9b" stroke-width="3"/><path d="M100 157 V194 M270 157 V194 M338 150 V202 M780 150 V202" stroke="#597e9b" stroke-width="3"/><g font-size="20" text-anchor="middle"><text x="100" y="140">Date=90</text><text x="270" y="224">发出100</text><text x="338" y="140">收到104</text><text x="780" y="140">当前130</text></g><path d="M338 267 H780" stroke="#74aab7" stroke-width="12" stroke-linecap="round"/><text x="495" y="251" font-size="21">本地驻留 26 秒</text><rect x="40" y="307" width="820" height="153" rx="14" fill="#fff"/><g font-size="21"><text x="65" y="342">表观年龄：104−90=14</text><text x="460" y="342">校正 Age：12+(104−100)=16</text><text x="65" y="386">初始年龄：max(14,16)=16</text><text x="460" y="386">当前年龄：16+26=42</text><text x="65" y="430">寿命 60 秒，仍新鲜；到相对时刻148时恰好过期。</text></g><text x="40" y="486" font-size="18">这里不是“收到后再计60秒”：先扣掉已有年龄16，再计算剩余新鲜窗口。</text></g></svg>
