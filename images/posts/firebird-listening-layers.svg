<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-label="音色动作与过程功能的三层观察卡"><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:19px;fill:#263c4a}.title{font-size:26px;font-weight:700}.bold{font-weight:700}.small{font-size:17px}.card{fill:#edf5f3;stroke:#9dbeb5;stroke-width:2}</style><rect width="900" height="440" rx="16" fill="#fbfdfc"/><text class="title" x="30" y="42">把印象变成可以回听的三层记录</text><rect class="card" x="30" y="100" width="260" height="235" rx="12"/><text class="bold" x="48" y="150">声音由谁呈现</text><text class="small" x="48" y="220">前景是谁？</text><text class="small" x="48" y="285">背景还在做什么？</text><rect class="card" x="320" y="100" width="260" height="235" rx="12"/><text class="bold" x="338" y="150">句子怎样运动</text><text class="small" x="338" y="220">重音、呼吸与持续</text><text class="small" x="338" y="285">哪些变化可以确认？</text><rect class="card" x="610" y="100" width="260" height="235" rx="12"/><text class="bold" x="628" y="150">前后关系怎样改变</text><text class="small" x="628" y="220">刚才准备了什么？</text><text class="small" x="628" y="285">解释与观察分开写</text><text class="small" x="30" y="391">先保留不确定的听感，再借助分段标题与来源核对；不是声学测量。</text></svg>
