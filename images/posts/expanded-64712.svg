<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title-64712 desc-64712"><title id="title-64712">忽略缺失与填零改变了统计对象</title><desc id="desc-64712">读入和保存后都应复核有效条数；不能把空白、字符串标记与NaN当成同一种数据语义。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#176756"/></marker></defs><rect width="900" height="360" fill="#f8fafc"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#172b45"><text x="36" y="38" font-size="24" font-weight="700">忽略缺失与填零改变了统计对象</text><text x="36" y="69" font-size="17" fill="#176756">并列对照：卡片宽度不表示数量、时长或比例</text><rect x="36" y="99" width="240" height="175" rx="12" fill="white" stroke="#176756" stroke-width="1.5"/><path d="M48 99 H264" stroke="#176756" stroke-width="4"/><text x="52" y="133" font-size="20" font-weight="700" fill="#176756">已观测2与4</text><text x="52" y="198" font-size="18">只描述两条记录，均值为3</text><rect x="330" y="99" width="240" height="175" rx="12" fill="white" stroke="#176756" stroke-width="1.5"/><path d="M342 99 H558" stroke="#176756" stroke-width="4"/><text x="346" y="133" font-size="20" font-weight="700" fill="#176756">缺失被填成0</text><text x="346" y="198" font-size="18">新增零值假设，均值为2</text><rect x="624" y="99" width="240" height="175" rx="12" fill="white" stroke="#176756" stroke-width="1.5"/><path d="M636 99 H852" stroke="#176756" stroke-width="4"/><text x="640" y="133" font-size="20" font-weight="700" fill="#176756">有效分母</text><text x="640" y="198" font-size="18">与形状类型和缺失表示一</text><text x="640" y="228" font-size="18">起核对</text><text x="36" y="319" font-size="17">依据本文已有情境绘制 · 不表示生产测量或通用性能保证</text></g></svg>
