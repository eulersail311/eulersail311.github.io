<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title-79861 desc-79861"><title id="title-79861">端点恰为LCA仍然要减二</title><desc id="desc-79861">三点链的小账本区分节点标记与边答案；原始标记为负并不意味着最终计数非法。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#225a8c"/></marker></defs><rect width="900" height="360" fill="#f8fafc"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#172b45"><text x="36" y="38" font-size="24" font-weight="700">端点恰为LCA仍然要减二</text><text x="36" y="69" font-size="17" fill="#225a8c">步骤关系：箭头表示本图的处理或观察顺序</text><rect x="36" y="99" width="240" height="175" rx="12" fill="white" stroke="#225a8c" stroke-width="1.5"/><path d="M48 99 H264" stroke="#225a8c" stroke-width="4"/><text x="52" y="133" font-size="20" font-weight="700" fill="#225a8c">路径2到3</text><text x="52" y="198" font-size="18">端点2和3各加1</text><path d="M283 185 H317" stroke="#225a8c" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="99" width="240" height="175" rx="12" fill="white" stroke="#225a8c" stroke-width="1.5"/><path d="M342 99 H558" stroke="#225a8c" stroke-width="4"/><text x="346" y="133" font-size="20" font-weight="700" fill="#225a8c">LCA为2</text><text x="346" y="198" font-size="18">再减2使节点2净标记为负1</text><path d="M577 185 H611" stroke="#225a8c" stroke-width="2" marker-end="url(#arrow)"/><rect x="624" y="99" width="240" height="175" rx="12" fill="white" stroke="#225a8c" stroke-width="1.5"/><path d="M636 99 H852" stroke="#225a8c" stroke-width="4"/><text x="640" y="133" font-size="20" font-weight="700" fill="#225a8c">后序汇总</text><text x="640" y="198" font-size="18">边2到3为1、边1到2为0</text><text x="36" y="319" font-size="17">依据本文已有情境绘制 · 不表示生产测量或通用性能保证</text></g></svg>
