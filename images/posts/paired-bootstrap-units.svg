<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">配对 Bootstrap 的记录与抽样单位</title><desc id="desc">同一抽样索引保留旧新评分配对，五条记录可以有放回抽取；同源多行必须依据数据设计决定是否成组抽样。</desc><rect width="900" height="520" rx="20" fill="#f5f7fb"/><g font-family="Microsoft YaHei, sans-serif" fill="#193750"><text x="40" y="48" font-size="26" font-weight="700">抽同一条记录，也保留它的配对</text><rect x="40" y="92" width="340" height="180" rx="16" fill="#e0eef5" stroke="#407996" stroke-width="2"/><text x="62" y="133" font-size="23">原始记录：A B C D E</text><text x="62" y="178" font-size="22">旧分：0 1 0 0 1</text><text x="62" y="222" font-size="22">新分：1 1 1 0 0</text><rect x="470" y="92" width="390" height="180" rx="16" fill="#e4f0e6" stroke="#4f7b56" stroke-width="2"/><text x="492" y="133" font-size="23">抽样索引：A A C E B</text><text x="492" y="178" font-size="22">差值：1 1 1 −1 0</text><text x="492" y="222" font-size="22">本次均值差 Δ* = 0.4</text><path d="M380 183 H468 l-12 -8 m12 8 l-12 8" fill="none" stroke="#193750" stroke-width="3"/><rect x="40" y="315" width="820" height="125" rx="16" fill="#fff" stroke="#b0bdcb" stroke-width="2"/><text x="62" y="353" font-size="23" font-weight="700">多行来自同一来源？先确定独立单位</text><text x="62" y="393" font-size="20">按文档或用户抽组时，保留选中组内的全部配对记录</text><text x="62" y="426" font-size="18">复制一条记录，不会增加一份独立证据</text><text x="40" y="484" font-size="17">原创重采样关系图 · 合成评分 · 不是模型效果的实测图</text></g></svg>
