<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title-53074 desc-53074"><title id="title-53074">找回候选要先固定身份</title><desc id="desc-53074">reflog序号会随本地记录变化；能读取对象与对象已成为当前分支祖先是两件事。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#47652c"/></marker></defs><rect width="900" height="360" fill="#f8fafc"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#172b45"><text x="36" y="38" font-size="24" font-weight="700">找回候选要先固定身份</text><text x="36" y="69" font-size="17" fill="#47652c">步骤关系：箭头表示本图的处理或观察顺序</text><rect x="36" y="99" width="240" height="175" rx="12" fill="white" stroke="#47652c" stroke-width="1.5"/><path d="M48 99 H264" stroke="#47652c" stroke-width="4"/><text x="52" y="133" font-size="20" font-weight="700" fill="#47652c">读取日志候选</text><text x="52" y="198" font-size="18">核对完整对象与父关系</text><path d="M283 185 H317" stroke="#47652c" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="99" width="240" height="175" rx="12" fill="white" stroke="#47652c" stroke-width="1.5"/><path d="M342 99 H558" stroke="#47652c" stroke-width="4"/><text x="346" y="133" font-size="20" font-weight="700" fill="#47652c">检查文件快照</text><text x="346" y="198" font-size="18">确认它是需要的版本</text><path d="M577 185 H611" stroke="#47652c" stroke-width="2" marker-end="url(#arrow)"/><rect x="624" y="99" width="240" height="175" rx="12" fill="white" stroke="#47652c" stroke-width="1.5"/><path d="M636 99 H852" stroke="#47652c" stroke-width="4"/><text x="640" y="133" font-size="20" font-weight="700" fill="#47652c">建立新引用</text><text x="640" y="198" font-size="18">固定候选，再决定是否合</text><text x="640" y="228" font-size="18">入</text><text x="36" y="319" font-size="17">依据本文已有情境绘制 · 不表示生产测量或通用性能保证</text></g></svg>
