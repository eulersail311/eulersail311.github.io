<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480"><title>用反例修订精确率的解释</title><rect width="900" height="480" rx="18" fill="#faf4ec"/><g font-family="Microsoft YaHei,sans-serif" fill="#62401f"><text x="35" y="52" font-size="28" font-weight="700">改变新增样本，检查解释是否仍成立</text><rect x="35" y="90" width="830" height="85" rx="12" fill="white" stroke="#dfc8aa"/><text x="60" y="126" font-size="22">共同起点：TP=2，FP=1，P=2/3</text><text x="60" y="156" font-size="18">保持旧样本不变，改变随后加入的那一条记录。</text><rect x="35" y="205" width="395" height="155" rx="12" fill="white" stroke="#dfc8aa"/><rect x="470" y="205" width="395" height="155" rx="12" fill="white" stroke="#dfc8aa"/><text x="60" y="245" font-size="23" font-weight="700">新增一条正例</text><text x="495" y="245" font-size="23" font-weight="700">新增一条负例</text><text x="60" y="292" font-size="22">TP=3，FP=1 → P=3/4</text><text x="495" y="292" font-size="22">TP=2，FP=2 → P=1/2</text><text x="60" y="332" font-size="19">精确率提高</text><text x="495" y="332" font-size="19">精确率降低</text><text x="35" y="410" font-size="21">修订：精确率的变化取决于新增部分的构成。</text><text x="35" y="447" font-size="18">原创合成对照，不是学习效果测量。</text></g></svg>
