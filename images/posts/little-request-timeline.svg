<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-label="四请求等待与执行的成比例时间线"><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:19px;fill:#243c4a}.title{font-size:26px;font-weight:700}.bold{font-weight:700}.small{font-size:17px}.card{fill:#edf5f3;stroke:#9dbeb5;stroke-width:2}.axis{stroke:#a6b8bf;stroke-width:1}</style><rect width="900" height="460" rx="16" fill="#fbfdfc"/><text class="title" x="30" y="45">四个请求：等待与执行共同组成停留时间</text><rect x="140" y="69" width="28" height="16" fill="#b8d8cc"/><text class="small" x="180" y="84">等待</text><rect x="300" y="69" width="28" height="16" fill="#267e76"/><text class="small" x="340" y="84">执行</text><line class="axis" x1="140" x2="140" y1="108" y2="372"/><text class="small" text-anchor="middle" x="140" y="401">0</text><line class="axis" x1="220" x2="220" y1="108" y2="372"/><text class="small" text-anchor="middle" x="220" y="401">1</text><line class="axis" x1="300" x2="300" y1="108" y2="372"/><text class="small" text-anchor="middle" x="300" y="401">2</text><line class="axis" x1="380" x2="380" y1="108" y2="372"/><text class="small" text-anchor="middle" x="380" y="401">3</text><line class="axis" x1="460" x2="460" y1="108" y2="372"/><text class="small" text-anchor="middle" x="460" y="401">4</text><line class="axis" x1="540" x2="540" y1="108" y2="372"/><text class="small" text-anchor="middle" x="540" y="401">5</text><line class="axis" x1="620" x2="620" y1="108" y2="372"/><text class="small" text-anchor="middle" x="620" y="401">6</text><line class="axis" x1="700" x2="700" y1="108" y2="372"/><text class="small" text-anchor="middle" x="700" y="401">7</text><line class="axis" x1="780" x2="780" y1="108" y2="372"/><text class="small" text-anchor="middle" x="780" y="401">8</text><g data-job="A" data-arrival="0" data-start="0" data-departure="2"><text class="bold" x="45" y="146">A</text><rect x="140" y="125" width="0" height="28" fill="#b8d8cc"/><rect x="140" y="125" width="160" height="28" fill="#267e76"/><text class="small" x="800" y="146">W=2s</text></g><g data-job="B" data-arrival="1" data-start="2" data-departure="5"><text class="bold" x="45" y="211">B</text><rect x="220" y="190" width="80" height="28" fill="#b8d8cc"/><rect x="300" y="190" width="240" height="28" fill="#267e76"/><text class="small" x="800" y="211">W=4s</text></g><g data-job="C" data-arrival="3" data-start="5" data-departure="6"><text class="bold" x="45" y="276">C</text><rect x="380" y="255" width="160" height="28" fill="#b8d8cc"/><rect x="540" y="255" width="80" height="28" fill="#267e76"/><text class="small" x="800" y="276">W=3s</text></g><g data-job="D" data-arrival="4" data-start="6" data-departure="8"><text class="bold" x="45" y="341">D</text><rect x="460" y="320" width="160" height="28" fill="#b8d8cc"/><rect x="620" y="320" width="160" height="28" fill="#267e76"/><text class="small" x="800" y="341">W=4s</text></g><text class="small" x="30" y="444">横轴：s；总停留13请求·s = 等待5请求·s + 执行8请求·s</text></svg>
