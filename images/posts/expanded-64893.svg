<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title-64893 desc-64893"><title id="title-64893">配对重采样要一起带走两模型结果</title><desc id="desc-64893">分别抽两列会破坏配对关系；记录重采样差值，才能让区间回答指定对象上的比较。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#176756"/></marker></defs><rect width="900" height="360" fill="#f8fafc"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#172b45"><text x="36" y="38" font-size="24" font-weight="700">配对重采样要一起带走两模型结果</text><text x="36" y="69" font-size="17" fill="#176756">步骤关系：箭头表示本图的处理或观察顺序</text><rect x="36" y="99" width="240" height="175" rx="12" fill="white" stroke="#176756" stroke-width="1.5"/><path d="M48 99 H264" stroke="#176756" stroke-width="4"/><text x="52" y="133" font-size="20" font-weight="700" fill="#176756">抽用户身份</text><text x="52" y="198" font-size="18">保留原本的任务难度配对</text><path d="M283 185 H317" stroke="#176756" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="99" width="240" height="175" rx="12" fill="white" stroke="#176756" stroke-width="1.5"/><path d="M342 99 H558" stroke="#176756" stroke-width="4"/><text x="346" y="133" font-size="20" font-weight="700" fill="#176756">同时取两列</text><text x="346" y="198" font-size="18">在同一批抽样身份上求差</text><path d="M577 185 H611" stroke="#176756" stroke-width="2" marker-end="url(#arrow)"/><rect x="624" y="99" width="240" height="175" rx="12" fill="white" stroke="#176756" stroke-width="1.5"/><path d="M636 99 H852" stroke="#176756" stroke-width="4"/><text x="640" y="133" font-size="20" font-weight="700" fill="#176756">用户内有相关行</text><text x="640" y="198" font-size="18">再检查是否应提升抽样单</text><text x="640" y="228" font-size="18">位</text><text x="36" y="319" font-size="17">依据本文已有情境绘制 · 不表示生产测量或通用性能保证</text></g></svg>
