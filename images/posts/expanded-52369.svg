<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title-52369 desc-52369"><title id="title-52369">严格递减必须排除相等值</title><desc id="desc-52369">扫描决定位置关系，前缀端点决定严格值关系；左右选择数相乘之前，两层条件都要成立。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#225a8c"/></marker></defs><rect width="900" height="360" fill="#f8fafc"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#172b45"><text x="36" y="38" font-size="24" font-weight="700">严格递减必须排除相等值</text><text x="36" y="69" font-size="17" fill="#225a8c">并列对照：卡片宽度不表示数量、时长或比例</text><rect x="36" y="99" width="240" height="175" rx="12" fill="white" stroke="#225a8c" stroke-width="1.5"/><path d="M48 99 H264" stroke="#225a8c" stroke-width="4"/><text x="52" y="133" font-size="20" font-weight="700" fill="#225a8c">数组4、3、2、1</text><text x="52" y="198" font-size="18">任取三个递增下标，共4组</text><rect x="330" y="99" width="240" height="175" rx="12" fill="white" stroke="#225a8c" stroke-width="1.5"/><path d="M342 99 H558" stroke="#225a8c" stroke-width="4"/><text x="346" y="133" font-size="20" font-weight="700" fill="#225a8c">数组2、2、1</text><text x="346" y="198" font-size="18">没有严格递减三元组</text><rect x="624" y="99" width="240" height="175" rx="12" fill="white" stroke="#225a8c" stroke-width="1.5"/><path d="M636 99 H852" stroke="#225a8c" stroke-width="4"/><text x="640" y="133" font-size="20" font-weight="700" fill="#225a8c">离散化之后</text><text x="640" y="198" font-size="18">相等仍处在同一比较等级</text><text x="36" y="319" font-size="17">依据本文已有情境绘制 · 不表示生产测量或通用性能保证</text></g></svg>
